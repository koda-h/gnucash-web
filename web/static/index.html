<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>GnuCash Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f2f4f7; --hover:#f7f8fa;
  --border:#e4e7ec; --border-strong:#d0d5dd;
  --text:#101828; --muted:#667085; --faint:#98a2b3;
  --accent:#3559e0; --accent-soft:#eef2ff; --accent-text:#2f4cc2;
  --pos:#067647; --neg:#c4320a; --pos-soft:#ecfdf3; --neg-soft:#fef3f2;
  --flash:#fff7d6; --warn:#b45309;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 8px 24px rgba(16,24,40,.10),0 2px 6px rgba(16,24,40,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --hover:#1c2029;
    --border:#272c36; --border-strong:#353b47;
    --text:#e7e9ee; --muted:#9aa3b2; --faint:#6b7383;
    --accent:#7c98ff; --accent-soft:#1e2540; --accent-text:#a9bbff;
    --pos:#4ade80; --neg:#ff8a73; --pos-soft:#12261b; --neg-soft:#2c1714;
    --flash:#3a3313; --warn:#f5b94a;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 8px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#171a21; --surface-2:#1e222b; --hover:#1c2029;
  --border:#272c36; --border-strong:#353b47;
  --text:#e7e9ee; --muted:#9aa3b2; --faint:#6b7383;
  --accent:#7c98ff; --accent-soft:#1e2540; --accent-text:#a9bbff;
  --pos:#4ade80; --neg:#ff8a73; --pos-soft:#12261b; --neg-soft:#2c1714;
  --flash:#3a3313; --warn:#f5b94a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --shadow-lg:0 8px 24px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
/* hidden 属性は display を指定した要素でも必ず隠す */
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.5 Inter,"Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
/* iOS Safari は入力欄の font-size が 16px 未満だとフォーカス時に自動でページをズームする。
   その拡大・縮小の処理が端末やタイミングによっては固まることがある（scene-update watchdog）ため、16px 未満にならないようにする */
input{font-size:16px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.app{display:grid;grid-template-columns:340px 1fr;height:100vh;height:100dvh}

/* ---------- Sidebar ---------- */
.sidebar{border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.brand-name{font-weight:600;font-size:15px}
.brand-sub{color:var(--muted);font-size:12px}
.networth{margin:0 16px 12px;padding:14px 16px;border-radius:var(--radius);background:var(--surface-2)}
.networth .lbl{font-size:12px;color:var(--muted)}
.networth .val{font-size:22px;font-weight:600;letter-spacing:-.01em}
.networth .sub{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px}
.tree-tools{display:flex;gap:8px;padding:0 16px 10px}
.search{flex:1;position:relative}
.search input{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 10px 0 32px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search > svg{position:absolute;left:10px;top:9px;color:var(--faint)}
/* 入力内容のクリアボタン（文字が入っているときだけ表示） */
.search input:not(:placeholder-shown){padding-right:30px}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:0;border-radius:50%;
  padding:0;display:grid;place-items:center;cursor:pointer;background:var(--border-strong);color:var(--surface)}
.search .clear:hover{background:var(--muted)}
.search input:placeholder-shown ~ .clear{display:none}
/* 出金元・入金先欄のクリアボタン（検索欄と同じ見た目） */
.fclear{position:relative}
.fclear .f:not(:placeholder-shown){padding-right:30px}
.fclear .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:0;border-radius:50%;
  padding:0;display:grid;place-items:center;cursor:pointer;background:var(--border-strong);color:var(--surface)}
.fclear .clear:hover{background:var(--muted)}
.fclear .f:placeholder-shown ~ .clear{display:none}
/* 入力候補のドロップダウン（iOSのネイティブ datalist は scene-update のハングの原因になるため自前で描画する）。
   position:fixed はiOSでキーボード表示中に基準がずれることがあるため、ページ基準の absolute にしている */
.suggest-box{position:absolute;z-index:20;max-height:240px;overflow-y:auto;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow-lg);padding:4px}
.suggest-item{padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;white-space:normal;word-break:break-all;line-height:1.4}
.suggest-item.on{background:var(--accent-soft);color:var(--accent-text)}
.icon-btn{height:34px;min-width:34px;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0 8px}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.tree{flex:1;overflow:auto;padding:4px 8px 24px}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:14px 12px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.group-h .num{font-size:12px;letter-spacing:0;font-weight:500}
.trow{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px 0 calc(6px + var(--d) * 16px);border-radius:8px;cursor:pointer;user-select:none}
.trow:hover{background:var(--hover)}
.trow.sel{background:var(--accent-soft);color:var(--accent-text)}
.trow.sel .tbal{color:var(--accent-text)}
.chev{width:20px;height:20px;border:0;background:none;padding:0;cursor:pointer;color:var(--faint);display:grid;place-items:center;border-radius:4px;flex:none}
.chev:hover{color:var(--text);background:var(--surface-2)}
.chev svg{transition:transform .15s}
.chev.open svg{transform:rotate(90deg)}
.chev-sp{width:20px;flex:none}
.tname-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:4px}
.tname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow.ph .tname{font-weight:500}
.tbal{color:var(--muted);font-size:13px}
.tbal.neg{color:var(--neg)}
/* 勘定科目の編集ボタン（鉛筆アイコン）。一覧の行・科目名見出し・詳細画面のタイトル横に出す */
.tedit{width:20px;height:20px;flex:none;border:0;background:none;padding:0;cursor:pointer;color:var(--faint);display:grid;place-items:center;border-radius:4px}
.tedit:hover{color:var(--text);background:var(--surface-2)}
.trow.sel .tedit{color:var(--accent-text)}
.htedit{width:24px;height:24px;vertical-align:middle;margin-left:2px}
mark{background:var(--flash);color:inherit;border-radius:2px}

/* ---------- Main ---------- */
.main{min-width:0;display:flex;flex-direction:column;min-height:0}
.header{padding:22px 32px 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.back{display:none;border:0;background:none;color:var(--accent);padding:0;margin-bottom:8px;cursor:pointer;font-weight:500}
.crumbs{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumbs button{border:0;background:none;padding:0;color:inherit;cursor:pointer}
.crumbs button:hover{color:var(--accent)}
.title{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:2px 0 0;display:flex;align-items:center;gap:10px}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.desc{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:28px}
.stat .lbl{font-size:12px;color:var(--muted)}
.stat .val{font-size:15px;font-weight:500}
.stat.big .val{font-size:26px;font-weight:600;letter-spacing:-.01em}
.toolbar{display:flex;gap:12px;align-items:center;padding:0 32px 14px;flex-wrap:wrap}
.chips{display:flex;background:var(--surface-2);border-radius:9px;padding:3px}
.chip{border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-size:13px}
.chip.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:500}
.toolbar .search{max-width:280px}
.spacer{flex:1}
.btn{height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:0 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--surface-2)}
.btn.danger{border-color:transparent;background:none;color:var(--neg)}
.btn.danger:hover{background:var(--neg-soft)}

.card{margin:0 32px 24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;flex:1;overflow:hidden}
.cols{display:grid;grid-template-columns:118px minmax(160px,1.5fr) minmax(150px,1fr) 118px 118px 132px;gap:0 14px;align-items:center;padding:0 20px}
.reg-head{height:40px;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border);background:var(--surface)}
.r{text-align:right}
.scroll{overflow:auto;flex:1;min-height:0}
.month{position:sticky;top:0;z-index:1;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);padding:6px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.month .num{font-weight:500}
/* 取引一覧の行を左にスワイプすると右側に削除ボタンが出る */
.swipe{position:relative;overflow:hidden}
.swipe-del{position:absolute;top:0;bottom:0;right:0;width:84px;border:0;background:var(--neg);color:#fff;
  font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.swipe-content{position:relative;background:var(--surface);touch-action:pan-y}
.swipe:not(.dragging) .swipe-content{transition:transform .18s ease}
.row{min-height:46px;border-bottom:1px solid var(--border);cursor:pointer}
.row:hover{background:var(--hover)}
.row.flash{animation:flash 1.6s ease-out}
/* to を transparent にすると、スワイプ削除ボタンが背後にある行ではフェード中にそれが透けて見えるため、
   通常の背景色（surface）へ戻す */
@keyframes flash{from{background:var(--flash)}to{background:var(--surface)}}
.c-date{color:var(--muted)}
.c-date .wd{font-size:11px;margin-left:4px;color:var(--faint)}
.c-desc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-desc .ph{color:var(--faint)}
.c-acct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:middle}
.c-in.gain{color:var(--pos)}
.c-bal{font-weight:500}
.c-bal.neg{color:var(--neg)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}

/* edit / composer */
.edit{background:var(--accent-soft);border-bottom:1px solid var(--border);padding-top:10px;padding-bottom:10px;cursor:default}
.composer{border-top:1px solid var(--border-strong);background:var(--surface);padding-top:12px;padding-bottom:12px}
.composer-title{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.f{width:100%;max-width:100%;height:34px;border:1px solid var(--border-strong);border-radius:7px;background:var(--surface);padding:0 9px;outline:none;min-width:0}
.f:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f.r{text-align:right}
.f.err{border-color:var(--neg);box-shadow:0 0 0 3px var(--neg-soft)}
.f:disabled{background:var(--surface-2);color:var(--muted)}
.bal-preview{text-align:right;color:var(--muted)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:10px}
.hint{font-size:12px;color:var(--faint)}
.msg{font-size:12px;color:var(--neg)}
kbd{font:11px Inter,sans-serif;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}

/* overview (placeholder accounts) */
.overview{padding:0 32px 32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;overflow:auto}
.ocard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.ocard:hover{border-color:var(--accent)}
.ocard .n{font-weight:500}
.ocard .s{font-size:12px;color:var(--muted)}
.ocard .v{font-size:18px;font-weight:600;margin-top:8px}

/* パスキー認証 */
.auth-screen{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 24px 22px;box-shadow:var(--shadow-lg);text-align:center}
.auth-card .logo{margin:0 auto 14px;width:44px;height:44px;font-size:19px;border-radius:12px}
.auth-card h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
.auth-card p{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.7}
.auth-card label{display:block;text-align:left;font-size:12px;color:var(--muted);margin:0 0 4px}
.auth-card .f{height:40px;margin-bottom:12px}
.auth-card .f.token{text-align:center;font-size:16px;letter-spacing:.12em;font-variant-numeric:tabular-nums;text-transform:uppercase}
.auth-card .btn{width:100%;height:44px;justify-content:center;font-size:15px}
.auth-msg{min-height:20px;margin-top:10px;font-size:12.5px;color:var(--neg);line-height:1.6}
.auth-note{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint);line-height:1.8;text-align:left}
.auth-note code{font-size:11px;background:var(--surface-2);border-radius:4px;padding:1px 5px;color:var(--muted);word-break:break-all}
.side-foot{border-top:1px solid var(--border);padding:8px;display:flex;gap:4px}
.side-foot-auth{display:contents}
.side-foot button{flex:1;border:0;background:none;color:var(--muted);height:32px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
.side-foot button:hover{background:var(--hover);color:var(--text)}
dialog.keys{border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);padding:0;width:min(500px, calc(100vw - 32px));box-shadow:var(--shadow-lg)}
dialog.keys::backdrop{background:rgba(0,0,0,.5)}
.keys-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.keys-h h2{font-size:16px;margin:0}
.keys-list{padding:6px 12px;max-height:50vh;overflow:auto}
.key-item{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border)}
.key-item:last-child{border-bottom:0}
.key-item .k-name{font-weight:500}
.key-item .k-meta{font-size:12px;color:var(--muted)}
.key-item .k-body{flex:1;min-width:0}
.keys-add{padding:14px 20px 18px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 14px 14px}
.keys-add .row2{display:flex;gap:8px}
.keys-add .f{flex:1}
.keys-add .hint{display:block;margin-top:8px}
dialog.acct{width:min(440px, calc(100vw - 32px))}
.acct-body{padding:16px 20px 4px;max-height:min(520px, 70vh);overflow:auto}
.acct-field{margin-bottom:14px}
.acct-field label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
.acct-field .f{width:100%}
.acct-row2{display:flex;gap:10px}
.acct-row2 .acct-field{flex:1;min-width:0}
.acct-check{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;margin-bottom:12px;cursor:pointer}
.acct-check input{width:16px;height:16px;margin-top:2px;flex:none}
.acct-check.is-disabled{color:var(--faint);cursor:default}
.acct-msg{font-size:12.5px;color:var(--neg);min-height:18px;margin-top:2px}
.acct-bar{display:flex;align-items:center;gap:8px;padding:14px 20px 18px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 14px 14px}

/* 汎用の確認ダイアログ（window.confirm() の代わり。削除確認など） */
dialog.confirm{width:min(400px, calc(100vw - 32px))}
.confirm-body{padding:18px 20px 4px;font-size:13.5px;line-height:1.7;color:var(--text)}
.confirm-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:14px 20px 18px;margin-top:14px;border-top:1px solid var(--border);background:var(--surface-2);border-radius:0 0 14px 14px}

/* サイドバー上部のアイコンナビ（最近の取引・損益計算書・取り込み・統計など、
   画面が増えても横に並ぶだけでツリー表示領域を侵食しないようにする） */
.nav-bar{display:flex;gap:6px;padding:0 16px 14px}
.nav-icon{position:relative;width:38px;height:38px;flex:none;display:grid;place-items:center;
  border:0;border-radius:9px;background:none;cursor:pointer;color:inherit}
.nav-icon:hover{background:var(--hover)}
.nav-icon.on{background:var(--accent-soft);color:var(--accent-text)}
.nav-icon .badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:600;line-height:16px;text-align:center}
.nav-icon.on .badge{background:var(--accent);color:#fff}
/* 吹き出しは上端に近いので、既定（上に出す）ではなく下向きに出す */
.nav-bar [data-tip]::after{left:50%;bottom:auto;top:100%;margin-top:6px;margin-bottom:0;transform:translateX(-50%)}
.rgrid{display:grid;grid-template-columns:52px 76px minmax(140px,1fr) minmax(240px,1.6fr) 120px;gap:0 14px;align-items:center;padding:0 20px}
.rhead{height:36px;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border)}
.rrow{min-height:46px;border-bottom:1px solid var(--border);cursor:pointer}
.rrow:hover{background:var(--hover)}
.rrow.flash{animation:flash 1.6s ease-out}
.r-t{color:var(--muted)}
.r-pd{color:var(--muted);line-height:1.25}
.r-pd .wd{font-size:11px;color:var(--faint);margin-left:3px}
.r-pd.past{color:var(--text)}
.past-tag{display:block;font-size:10px;color:var(--warn);line-height:1.3}
.r-ds{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-ds .ph{color:var(--faint)}
.r-amt{font-weight:500}
.flow{display:flex;align-items:center;gap:6px;min-width:0}
.flow .pill{max-width:46%;flex:0 1 auto}
.flow .arrow{color:var(--faint);flex:none}
.pill.go{border:0;cursor:pointer;font:inherit;font-size:12.5px}
.pill.go:hover{color:var(--text);background:var(--border)}
.badge-new{font-size:10px;font-weight:700;color:var(--surface);background:var(--warn);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}

/* 取引検索 */
.srow{display:grid;grid-template-columns:76px minmax(160px,1fr) minmax(220px,1.4fr) 120px;gap:0 14px;align-items:center;padding:8px 20px;
  min-height:46px;border-bottom:1px solid var(--border);cursor:pointer}
.srow:hover{background:var(--hover)}
.srow.flash{animation:flash 1.6s ease-out}
.s-memo{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rsplit{background:var(--surface-2);border-bottom:1px solid var(--border);padding:4px 0}
.rsplit .rgrid{min-height:30px;font-size:13px}
.rsplit .m{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsplit .dir{font-size:11px;color:var(--faint);flex:none}
.rform{padding:14px 20px 12px;border-bottom:1px solid var(--border-strong);background:var(--surface)}
.rform.redit{background:var(--accent-soft);border-bottom:1px solid var(--border)}
.rform .composer-title{margin-bottom:8px}
/* 最近の取引画面の「新しい取引」欄の開閉（一覧をより多く見せたいとき用） */
form[data-form="rnew"] .composer-title{cursor:pointer;user-select:none}
form[data-form="rnew"] .composer-title svg{transition:transform .15s}
form[data-form="rnew"].open .composer-title svg{transform:rotate(45deg)}
form[data-form="rnew"]:not(.open) > :not(.composer-title){display:none}
form[data-form="rnew"]:not(.open){padding-top:14px;padding-bottom:14px}
form[data-form="rnew"]:not(.open) .composer-title{margin-bottom:0;color:var(--accent)}
.pgrid{display:grid;grid-template-columns:140px minmax(130px,1fr) minmax(170px,1.15fr) 32px minmax(170px,1.15fr) 120px;gap:10px;align-items:end}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fl > span{font-size:11px;color:var(--faint)}
.swap{height:34px;width:32px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.swap:hover{color:var(--text)}
.swap:disabled{opacity:.4;cursor:default}
.keep-note{font-size:10.5px;color:var(--accent-text);background:var(--accent-soft);border-radius:4px;padding:0 5px;margin-left:4px}

/* 登録簿の幅が狭いときは 2 段表示（コンテナクエリ） */
.card{container-type:inline-size;container-name:reg}
@container reg (max-width: 900px){
  .reg-head{display:none}
  .cols{grid-template-columns:62px minmax(0,1fr) auto;gap:2px 10px;padding:0 16px}
  .row{padding-top:8px;padding-bottom:8px}
  .row .c-date{grid-area:1/1/3/2;align-self:start;font-size:13px;line-height:1.3}
  .row .c-date .wd{display:block;margin:0}
  .row .c-desc{grid-area:1/2/2/3}
  .row .c-acct{grid-area:2/2/3/3}
  .row .c-in,.row .c-out{grid-area:1/3/2/4}
  .row .c-in:empty,.row .c-out:empty{display:none}
  .row .inc::before{content:"+"}
  .row .dec::before{content:"−"}
  .row .c-bal{grid-area:2/3/3/4;font-size:12px;color:var(--muted);font-weight:400}
  .row .c-bal.neg{color:var(--neg)}
  .month{padding:6px 16px}
  .edit.cols,.composer.cols{grid-template-columns:1fr 1fr;gap:14px}
  .edit .e-date,.composer .e-date{grid-column:1/-1}
  .edit .e-desc,.composer .e-desc,.edit .e-acct,.composer .e-acct{grid-column:1/-1}
  .edit{padding-top:10px;padding-bottom:10px}
  .composer{padding-top:12px;padding-bottom:12px}
  .bal-preview{display:none}
  .hint{display:none}
  /* ボタンが収まりきらない時は折り返して縦書きになるのではなく、横にスクロールさせる。
     gap を詰め、ボタンの左右余白も少し減らしておくと、画面が狭いときも
     spacer が自然に縮んで「保存」がスクロールなしで収まりやすい */
  .bar{overflow-x:auto;gap:2px}
  .bar .btn{padding:0 10px}
  .sline-head,.s-idx{display:none}
  .split-view .sline{grid-template-columns:62px minmax(0,1fr) auto;padding-top:4px;padding-bottom:4px}
  .split-view .sline .s-memo{grid-area:2/2/3/3;font-size:12px}
  .split-view .sline .c-acct{grid-area:1/2/2/3}
  .split-view .sline .r:empty{display:none}
  .split-view .sline .r[data-label]{grid-area:1/3/2/4}
  .split-view .sline .r[data-label]:not(:empty)::before{content:attr(data-label) " ";font-size:11px;color:var(--muted)}
  .split-edit .sline{grid-template-columns:1fr 1fr auto;gap:6px}
  .split-edit .e-sacct{grid-area:1/1/2/3}
  .split-edit .e-x{grid-area:1/3/2/4}
  .split-edit .e-smemo{grid-area:2/1/3/4}
  .split-edit .e-sl{grid-area:3/1/4/2}
  .split-edit .e-sr{grid-area:3/2/4/4}
  .split-edit .sline{padding-bottom:8px;border-bottom:1px solid var(--border)}
  .rhead{display:none}
  .rgrid{grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;padding:8px 16px}
  .rrow .r-t{grid-area:1/1/2/2;font-size:12px}
  .rrow .r-pd{grid-area:2/1/3/2;font-size:12px}
  .rrow .r-pd .wd{display:none}
  .rrow .r-ds{grid-area:1/2/2/3}
  .rrow .flow{grid-area:2/2/3/4}
  .rrow .r-amt{grid-area:1/3/2/4}
  .rsplit .rgrid > span:nth-child(-n+2){display:none}
  .rsplit .flow{grid-area:1/2/2/3}
  .rsplit .m{grid-area:2/2/3/3;font-size:12px}
  .rsplit .m:empty{display:none}
  .rsplit .r{grid-area:1/3/2/4}
  .rsplit .flow .pill{max-width:100%}
  .rform{padding:12px 16px}
  .pgrid{grid-template-columns:1fr 32px 1fr;gap:8px}
  .pgrid .c-date{grid-column:1/-1;overflow:hidden}
  /* iOS のネイティブ日付ピッカーは width:100% を無視して内容の幅で広がることがあるため、
     width をごく小さい値にして track のサイズ計算に影響させず、min-width で改めて 100% まで広げる */
  .pgrid .c-date .f{width:1px;min-width:100%}
  .pgrid .c-amt{grid-column:1/-1}
  .pgrid .c-desc{grid-column:1/-1}
  .composer:not(.open) > :not(.composer-title){display:none}
  .composer:not(.open) .composer-title{margin:0;cursor:pointer;color:var(--accent);font-size:14px}
  .composer:not(.open){padding-top:14px;padding-bottom:14px}
}
/* マネーフォワード ME 取り込みの確認テーブルは、6列を横に並べるにはやや幅が要るので
   register など他の2段表示（900px）より狭い専用のしきい値で切り替える */
@container reg (max-width: 640px){
  .imp-grid.imp-head{display:none}
  .imp-grid.imp-row2{grid-template-columns:52px minmax(0,1fr) auto;grid-template-rows:auto auto auto;gap:3px 10px;padding:10px 16px}
  .imp-grid.imp-row2 > *:nth-child(1){grid-area:1/1/4/2;font-size:12px;color:var(--muted);align-self:start;white-space:normal}
  .imp-grid.imp-row2 > *:nth-child(2){grid-area:1/2/2/3}
  .imp-grid.imp-row2 > *:nth-child(3){grid-area:2/2/3/3;font-size:12px;color:var(--muted)}
  .imp-grid.imp-row2 > *:nth-child(4){grid-area:3/2/4/3;font-size:12px;color:var(--muted)}
  .imp-grid.imp-row2 > *:nth-child(5){grid-area:1/3/2/4;text-align:right}
  .imp-grid.imp-row2 > *:nth-child(6){grid-area:2/3/4/4;flex-direction:column;align-items:flex-end;gap:2px}
}

/* 損益計算書 */
.rep-card{padding:0}
.rep-section{padding:4px 0 0}
.rep-head{font-size:13px;font-weight:600;color:var(--muted);padding:14px 20px 6px;letter-spacing:.02em}
.rep-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;padding:0 20px 0 calc(20px + var(--d) * 16px);border-bottom:1px solid var(--border)}
.rep-name{border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-name:hover{color:var(--accent-text)}
.rep-amt{font-weight:500;white-space:nowrap;flex:none}
.rep-amt.neg{color:var(--neg)}
.rep-empty{padding:10px 20px 14px;color:var(--muted);font-size:13px}
.rep-total{display:flex;justify-content:space-between;padding:10px 20px;font-weight:600;background:var(--surface-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.rep-net{display:flex;justify-content:space-between;padding:16px 20px;font-weight:700;font-size:18px;background:var(--accent-soft);color:var(--accent-text)}
.rep-net.neg{background:var(--neg-soft);color:var(--neg)}
.rep-period{padding:0 32px 14px;font-size:15px;font-weight:600;color:var(--text)}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#101828;color:#fff;border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-lg);transition:.2s;z-index:10;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}

/* ---------- Mobile ---------- */
@media (max-width: 820px){
  .app{grid-template-columns:1fr}
  .main{display:none}
  .app.show-main .sidebar{display:none}
  .app.show-main .main{display:flex}
  .back{display:inline-block}
  .header{padding:16px 16px 12px}
  .toolbar{padding:0 16px 12px}
  .rep-period{padding:0 16px 12px}
  .toolbar .search{max-width:none;flex-basis:100%}
  .card{margin:0 0 0;border-radius:0;border-left:0;border-right:0}
  .overview{padding:0 16px 24px}
}

/* 実データ用の追加スタイル */
.rec{display:inline-block;font-size:10.5px;font-weight:600;line-height:16px;padding:0 5px;border-radius:4px;margin-left:6px;vertical-align:1px;background:var(--pos-soft);color:var(--pos)}
.rec.c{background:var(--surface-2);color:var(--muted)}
.tnum{color:var(--faint);font-size:12px;margin-right:6px}
.more{display:block;width:100%;border:0;border-bottom:1px solid var(--border);background:none;color:var(--accent);padding:10px;cursor:pointer;font-weight:500}
.more:hover{background:var(--hover)}
.banner{margin:0 16px 12px;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.6;background:var(--surface-2);color:var(--muted)}
.banner.warn{background:var(--neg-soft);color:var(--neg)}
.banner b{color:var(--text)}
.banner.warn b{color:inherit}
.readonly-note{border-top:1px solid var(--border);padding:12px 20px;font-size:12px;color:var(--muted);background:var(--surface)}
.loading{padding:56px 20px;text-align:center;color:var(--muted)}
.trow.hidden-acct .tname{color:var(--faint)}
form.busy{opacity:.6;pointer-events:none}

/* 分割取引 */
.split-toggle{border:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12.5px}
.split-toggle:hover{color:var(--text);background:var(--border)}
.split-toggle svg{transition:transform .15s;flex:none}
.split-toggle.open{background:var(--accent-soft);color:var(--accent-text)}
.split-toggle.open svg{transform:rotate(90deg)}
.split-view{background:var(--surface-2);border-bottom:1px solid var(--border);padding:4px 0}
.sline{min-height:32px;font-size:13px}
.s-memo{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.self{background:var(--accent-soft);color:var(--accent-text)}
.split-edit{grid-column:1/-1;margin-top:10px;padding-top:8px;border-top:1px dashed var(--border-strong)}
.split-edit .cols{padding:0}
.split-edit .sline{margin-bottom:6px}
.sline-head{font-size:11px;color:var(--muted);height:22px}
.s-idx{color:var(--faint);font-size:12px;text-align:right}
.e-x{height:30px;min-width:30px;justify-self:start}
.split-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.imb{font-size:12px;font-weight:500}
.imb.ok{color:var(--pos)}
.imb.ng{color:var(--neg)}
.split-ro{grid-column:1/-1;margin-top:10px;border-radius:8px;overflow:hidden}
.split-ro .split-view{border:0}

/* マネーフォワード ME 取り込み */
.imp-section{padding:16px 20px;border-bottom:1px solid var(--border)}
.imp-section h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px}
.imp-drop{display:block;border:2px dashed var(--border-strong);border-radius:10px;padding:20px 16px;color:var(--muted);font-size:13px;line-height:1.7}
.imp-drop input[type=file]{display:block;margin-top:10px;font-size:13px}
.imp-map-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.imp-map-row:last-child{border-bottom:0}
.imp-map-row .lbl{flex:1;min-width:0;font-size:13px}
.imp-map-row .lbl b{display:block;font-weight:500;color:var(--text)}
.imp-map-row .lbl span{color:var(--faint);font-size:12px}
.imp-map-row .f{width:240px;flex:none}
.imp-cat-group{padding:10px 0;border-bottom:1px solid var(--border)}
.imp-cat-group:last-child{border-bottom:0}
.imp-cat-group > .imp-map-row{border-bottom:0;padding:4px 0}
.imp-sub-list{margin:6px 0 2px 14px;padding-left:12px;border-left:2px solid var(--border)}
.imp-sub-list .imp-map-row{padding:6px 0}
.imp-sub-list .imp-map-row .lbl{font-size:12.5px}
.imp-sub-list .imp-map-row .lbl b{font-weight:500;font-size:12.5px}
.imp-grid{display:grid;grid-template-columns:92px minmax(90px,1.4fr) minmax(90px,1fr) minmax(90px,1fr) 90px minmax(60px,110px);gap:0 12px;align-items:center;padding:0 20px}
.imp-grid > *:nth-child(1){white-space:nowrap}
/* 「4.」一覧のセル省略表示用ツールチップ。ブラウザ標準の title は表示までが遅いため、
   短い遅延（.12s）で出る独自のツールチップにしている。中の .c-desc/.c-acct は省略表示のため
   overflow:hidden なので、data-tip（吹き出し）はそれを包む .imp-tip 側に付けて、吹き出し自体が
   一緒に切り取られないようにする */
.imp-tip{position:relative;display:block;min-width:0}
.imp-tip > span{display:block;min-width:0}
[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;left:0;bottom:100%;margin-bottom:6px;z-index:5;
  max-width:320px;width:max-content;white-space:normal;font-size:12px;line-height:1.5;
  background:#101828;color:#fff;padding:5px 9px;border-radius:7px;box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .1s ease, visibility 0s linear .12s;
}
[data-tip]:hover::after,[data-tip]:focus-visible::after{
  opacity:1;visibility:visible;transition-delay:.12s,0s;
}
.imp-head{position:sticky;top:0;z-index:1;background:var(--surface);height:36px;font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border)}
.imp-row2{min-height:40px;border-bottom:1px solid var(--border);font-size:13px}
.imp-row2.dup{opacity:.55}
.imp-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.imp-tag.dup{background:var(--neg-soft);color:var(--neg)}
.imp-tag.new{background:var(--pos-soft);color:var(--pos)}
.imp-tag.pair{background:var(--accent-soft);color:var(--accent-text)}
.imp-tag.pending{background:var(--flash);color:var(--warn)}
.imp-undo{height:auto;padding:1px 8px;font-size:11px;font-weight:500}
.imp-status{display:flex;flex-direction:row;align-items:center;gap:4px}

/* 統計・グラフ */
/* ラベル付きの開始年月・終了年月（.fl）とラベル無しの検索欄・追加ボタンが並ぶため、
   中央揃えだとラベルの分だけ検索欄・ボタンが高い位置にずれる。下端で揃える */
.stats-toolbar{align-items:flex-end}
.stats-card{padding:16px 20px 20px}
.stats-legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.stats-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px}
.stats-chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tag{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:1px 7px;margin-left:6px}
.stats-chip .tag{margin-left:0}
.stats-chip .x{border:0;background:none;cursor:pointer;color:var(--faint);width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:12px;line-height:1}
.stats-chip .x:hover{background:var(--hover);color:var(--text)}
.stats-chart{position:relative;overflow:visible}
.stats-pt{cursor:pointer}
.stats-tooltip{position:absolute;transform:translate(-50%,-100%) translateY(-8px);background:#101828;color:#fff;font-size:12px;
  line-height:1.5;padding:5px 9px;border-radius:7px;box-shadow:var(--shadow-lg);white-space:nowrap;pointer-events:none;z-index:5}
.stats-empty{padding:40px 20px;text-align:center;color:var(--muted)}

.ai-empty{padding:16px 4px;display:flex;flex-direction:column;gap:16px;align-items:flex-start;max-width:480px}
.ai-note{font-size:12.5px;color:var(--muted);line-height:1.6;background:var(--surface-2);border-radius:8px;padding:10px 12px}
.ai-card{padding:0}
.ai-period-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.ai-period-side{display:flex;align-items:center;gap:8px}
.ai-scroll{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:92%;padding:9px 13px;border-radius:14px;font-size:13.5px;line-height:1.6}
.ai-msg.user{max-width:78%;align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.ai-msg.assistant{align-self:flex-start;background:var(--surface-2);color:var(--text);border-bottom-left-radius:4px}
.ai-msg.assistant.error{background:var(--neg-soft);color:var(--neg)}
.ai-msg.raw{white-space:pre-wrap}
.ai-msg p{margin:0 0 8px}
.ai-msg p:last-child{margin-bottom:0}
.ai-msg ul,.ai-msg ol{margin:4px 0 8px;padding-left:20px}
.ai-msg ul:last-child,.ai-msg ol:last-child{margin-bottom:0}
.ai-msg li{margin:2px 0}
.ai-msg strong{font-weight:700}
.ai-msg em{font-style:italic}
.ai-msg h3,.ai-msg h4,.ai-msg h5,.ai-msg h6{margin:10px 0 6px;font-weight:700;line-height:1.4}
.ai-msg :first-child{margin-top:0}
.ai-msg h3{font-size:15px}
.ai-msg h4{font-size:14px}
.ai-msg h5,.ai-msg h6{font-size:13.5px}
.ai-msg table{display:block;overflow-x:auto;border-collapse:collapse;width:max-content;max-width:100%;margin:4px 0 10px;font-size:12.5px}
.ai-msg table:last-child{margin-bottom:0}
.ai-msg th,.ai-msg td{border:1px solid var(--border);padding:4px 9px;text-align:left;white-space:nowrap}
.ai-msg th{font-weight:600;background:var(--surface)}
.ai-typing{display:flex;gap:4px;padding:12px 15px}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ai-bounce 1.1s infinite ease-in-out}
.ai-typing span:nth-child(2){animation-delay:.15s}
.ai-typing span:nth-child(3){animation-delay:.3s}
@keyframes ai-bounce{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ai-composer{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--border-strong)}
.ai-composer input{flex:1;height:36px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);padding:0 11px;outline:none;min-width:0}
.ai-composer input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ai-hint{padding:0 20px 14px;display:block}

<script>
/* =========================================================
   GnuCash Web — web/server.py の API から実データを読み書きする
   split の値は「借方 = 正 / 貸方 = 負」。1取引の合計は必ず 0
   ========================================================= */
const TYPES = {
  ASSET:     {label:'資産',           credit:false, cols:['入金','出金'], group:'asset'},
  BANK:      {label:'銀行',           credit:false, cols:['入金','出金'], group:'asset'},
  CASH:      {label:'現金',           credit:false, cols:['入金','出金'], group:'asset'},
  STOCK:     {label:'株式',           credit:false, cols:['購入','売却'], group:'asset'},
  MUTUAL:    {label:'投資信託',        credit:false, cols:['購入','売却'], group:'asset'},
  RECEIVABLE:{label:'売掛金',          credit:false, cols:['請求','入金'], group:'asset'},
  CURRENCY:  {label:'通貨',           credit:false, cols:['入金','出金'], group:'asset'},
  CREDIT:    {label:'クレジットカード', credit:true,  cols:['返済','利用'], group:'liab'},
  LIABILITY: {label:'負債',           credit:true,  cols:['返済','借入'], group:'liab'},
  PAYABLE:   {label:'買掛金',          credit:true,  cols:['支払','請求'], group:'liab'},
  INCOME:    {label:'収益',           credit:true,  cols:['取消','収入']},
  EXPENSE:   {label:'費用',           credit:false, cols:['支出','返金']},
  EQUITY:    {label:'純資産',          credit:true,  cols:['減少','増加']},
  TRADING:   {label:'トレーディング',   credit:false, cols:['増加','減少']},
};
const T = type => TYPES[type] || {label:type, credit:false, cols:['増加','減少']};
const SYMBOLS = {JPY:'¥', USD:'$', EUR:'€', GBP:'£', CNY:'元'};
const PAGE = 300;
const REPORT_PRESETS = [['month','今月'],['lastMonth','先月'],['month2Ago','2ヶ月前'],['month3Ago','3ヶ月前'],['year','今年'],['lastYear','去年'],['custom','カスタム']];

const state = {
  book: null,
  selected: null,
  expanded: new Set(),
  editing: null,
  period: 'all',
  periodRange: null,      // 損益計算書から遷移した場合の期間 {from, to}（'report' チップ用）
  periodRangeLabel: '',   // 上記の表示ラベル
  q: '',
  treeQ: '',
  flash: null,
  today: '',
  lastDate: '',
  composerOpen: false,
  view: 'account',      // 'account' = 勘定科目の取引一覧、'recent' = 最近の取引
  recent: null,         // /api/recent の結果
  recentDays: 7,        // 今日 = 1 / 7 / 30
  recentFrom: '',       // 連続入力のため、追加後も残す出金元
  recentComposerOpen: true, // 最近の取引画面の「新しい取引」欄の開閉状態
  rnewVals: null,       // 描き直しで入力途中の内容が消えないよう退避
  added: new Set(),     // この画面で追加した取引（「追加」の印を付ける）
  reg: null,          // {account, rows}
  reportPreset: 'month', // 損益計算書の期間プリセット
  reportFrom: '',        // カスタム期間の開始年月・終了年月（"YYYY-MM"、日の指定はなし）
  reportTo: '',
  report: null,          // /api/reports/income-statement の結果
  reportRange: null,     // 実際に使われた {from, to}
  openSplits: new Set(), // 分割を展開表示している取引
  txCache: {},           // 取引 GUID → /api/transactions/{guid} の結果
  drafts: {},            // 分割入力中の下書き（'new' = 新規、その他は取引 GUID）
  limit: PAGE,
  imp: null,              // マネーフォワード ME 取り込み画面の状態
  stats: null,            // 統計・グラフ画面の状態 {from, to, selected, data}。null = まだ開いていない
  search: null,           // 取引検索画面の状態 {q, rows}。null = まだ開いていない
  ai: null,               // AI分析画面の状態 {status, period, range, messages, loading, context, systemPrompt}。null = まだ開いていない
  aiAvailable: null,      // サーバーに GNUCASH_AI_API_KEY が設定されているか。null = まだ確認できていない（未確認時は使える前提で表示する）
  showMonthHeaders: true, // 登録簿の月の区切り（見出し＋月合計）を表示するか。設定は localStorage に保存
  aiIncludeTxDetails: false, // AI分析：取引の説明・メモも送信するか。サーバー（app-settings.json）に保存される設定
  theme: 'system', // 配色（light/dark/system）。設定は localStorage に保存（ブラウザごとの見た目の設定のため）
};
try { state.showMonthHeaders = localStorage.getItem('showMonthHeaders') !== '0'; } catch (e) {}
function setShowMonthHeaders(v){
  state.showMonthHeaders = v;
  try { localStorage.setItem('showMonthHeaders', v ? '1' : '0'); } catch (e) {}
}
try { state.theme = localStorage.getItem('theme') || 'system'; } catch (e) {}
function setTheme(v){
  state.theme = v;
  try { localStorage.setItem('theme', v); } catch (e) {}
  if (v === 'light' || v === 'dark') document.documentElement.setAttribute('data-theme', v);
  else document.documentElement.removeAttribute('data-theme');
}
// アプリ設定（AI分析のオプションなど）：GnuCash のファイルとは別にサーバー側で保存される
async function loadAppSettings(){
  try {
    const s = await api('GET', '/api/settings');
    state.aiIncludeTxDetails = !!s.aiIncludeTxDetails;
    state.aiAvailable = !!s.aiAvailable;
    if (state.view === 'ai') render();
  } catch (e) {}
}
async function setAiIncludeTxDetails(v){
  const prev = state.aiIncludeTxDetails;
  state.aiIncludeTxDetails = v;
  if (state.view === 'ai') render();
  try { await api('PUT', '/api/settings', {aiIncludeTxDetails: v}); }
  catch (e) { state.aiIncludeTxDetails = prev; if (state.view === 'ai') render(); toast(e.message); }
}
let A = {}, CHILDREN = {}, ROOTS = [], TOTAL = {};

/* ---------- API ---------- */
async function api(method, url, body){
  const res = await fetch(url, {method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && data.auth && !url.startsWith('/api/auth/')) showAuth();   // ログイン切れ
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
async function loadBook(){
  const b = await api('GET', '/api/book');
  state.book = b;
  state.today ||= b.today;
  state.lastDate ||= b.today;
  A = {}; CHILDREN = {};
  for (const a of b.accounts) { A[a.guid] = a; (CHILDREN[a.parent || 'ROOT'] ||= []).push(a.guid); }
  ROOTS = CHILDREN.ROOT || [];
  // 子科目の合計は同じ通貨・銘柄のものだけ足す（換算はしない）
  TOTAL = {};
  const walk = id => (TOTAL[id] = A[id].balance + (CHILDREN[id] || [])
    .reduce((x, c) => { const v = walk(c); return A[c].commodity.mnemonic === A[id].commodity.mnemonic ? x + v : x; }, 0));
  ROOTS.forEach(walk);
}
async function loadRegister(id){
  state.reg = await api('GET', `/api/accounts/${id}/register`);
}
async function loadReport(){
  const r = reportRange(state.reportPreset, state.today, state.reportFrom, state.reportTo);
  state.reportRange = r;
  state.report = await api('GET', `/api/reports/income-statement?from=${r.from}&to=${r.to}`);
}
const canWrite = () => state.book && !state.book.readOnly && !state.book.writeBlocked;

/* ---------- 科目ヘルパ ---------- */
const path = id => { const p = []; for (let a = A[id]; a; a = A[a.parent]) p.unshift(a.name); return p; };
const fullName = id => A[id] ? path(id).join(':') : '（不明な科目）';
const sign = id => T(A[id].type).credit ? -1 : 1;
const digitsOf = id => Math.round(Math.log10((typeof id === 'object' ? id : A[id]?.commodity)?.fraction || 1));
// 金額の書式の基準。勘定科目の画面ではその科目、最近の取引では帳簿の主通貨
const bookCommodity = () => state.book.accounts.find(a => a.commodity.mnemonic === state.book.currency)?.commodity
  || {mnemonic: state.book.currency, fraction: 1};
const ctx = () => state.view === 'recent' ? bookCommodity() : state.selected;
const ctxFraction = () => (state.view === 'recent' ? bookCommodity() : A[state.selected].commodity).fraction || 1;

/* ---------- 表示ヘルパ ---------- */
function money(n, id){
  // id は勘定科目 GUID、または commodity オブジェクト
  const c = (typeof id === 'object' ? id : A[id]?.commodity) || {mnemonic: state.book?.currency || 'JPY', fraction: 1};
  const d = Math.round(Math.log10(c.fraction || 1));
  const v = Math.round(n * (c.fraction || 1)) / (c.fraction || 1);
  const s = Math.abs(v).toLocaleString('ja-JP', {minimumFractionDigits: d, maximumFractionDigits: d});
  const sym = SYMBOLS[c.mnemonic];
  return (v < 0 ? '−' : '') + (sym ? sym + s : `${s} ${c.mnemonic}`);
}
const plain = (n, id) => Math.abs(n).toLocaleString('ja-JP', {maximumFractionDigits: digitsOf(id)});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['日','月','火','水','木','金','土'];
const fmtDate = iso => { const [y,m,d] = iso.split('-'); return `${m}/${d}<span class="wd">${WD[new Date(+y, m-1, +d).getDay()]}</span>`; };
const hl = (text, q) => { if (!q) return esc(text); const i = text.toLowerCase().indexOf(q.toLowerCase()); return i < 0 ? esc(text) : esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length)); };
const chevron = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>';
const pencilIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
function parseAmt(s){
  const v = String(s).replace(/[,，¥\s円]/g, '').replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  if (v === '') return 0;
  return /^\d+(\.\d+)?$/.test(v) ? +v : NaN;
}
function shiftDay(iso, n){ const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y, m-1, d+n); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function shiftMonth(iso, n){ const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y, m-1+n, d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }

// 損益計算書の期間プリセット → {from, to}（カスタムは customFrom/customTo の年月("YYYY-MM")を月初〜月末に展開する）
function reportRange(preset, today, customFrom, customTo){
  const [y, m] = today.split('-').map(Number);
  const pad2 = n => String(n).padStart(2, '0');
  const lastDay = (yy, mm) => new Date(yy, mm, 0).getDate();   // mm は 1〜12
  // today の月から n ヶ月前の月初〜月末
  const monthsAgo = n => { let ty = y, tm = m - n;
    while (tm <= 0) { tm += 12; ty -= 1; }
    return {from: `${ty}-${pad2(tm)}-01`, to: `${ty}-${pad2(tm)}-${pad2(lastDay(ty, tm))}`}; };
  switch (preset) {
    case 'month': return monthsAgo(0);
    case 'lastMonth': return monthsAgo(1);
    case 'month2Ago': return monthsAgo(2);
    case 'month3Ago': return monthsAgo(3);
    case 'year': return {from: `${y}-01-01`, to: `${y}-12-31`};
    case 'lastYear': return {from: `${y - 1}-01-01`, to: `${y - 1}-12-31`};
    default: {   // 'custom'：年月("YYYY-MM")のみを扱う。開始・終了それぞれの月初〜月末を使う
      const [fy, fm] = (customFrom || `${y}-01`).split('-').map(Number);
      const [ty2, tm2] = (customTo || today.slice(0, 7)).split('-').map(Number);
      return {from: `${fy}-${pad2(fm)}-01`, to: `${ty2}-${pad2(tm2)}-${pad2(lastDay(ty2, tm2))}`};
    }
  }
}
// 損益計算書の期間ラベル（単月プリセットは「2026年11月」、それ以外は「2026年1月 - 2026年12月」）
const REPORT_SINGLE_MONTH_PRESETS = new Set(['month', 'lastMonth', 'month2Ago', 'month3Ago']);
function reportPeriodLabel(preset, range){
  const ym = iso => { const [y, m] = iso.split('-'); return `${y}年${+m}月`; };
  return REPORT_SINGLE_MONTH_PRESETS.has(preset) ? ym(range.from) : `${ym(range.from)} - ${ym(range.to)}`;
}

/* ---------- 統計・グラフ ---------- */
// 「純資産（資産－負債）」「純利益・純損失」は実際の科目ではなく合計の疑似シリーズとして扱う
const NETWORTH_ID = '__networth__';
const NET_INCOME_ID = '__netincome__';
const statsLabel = id => id === NETWORTH_ID ? '純資産（資産－負債）' : id === NET_INCOME_ID ? '純利益・純損失' : fullName(id);
// 科目の種類から「残高推移（資産・負債）」か「月次収支の推移（収益・費用）」かを判定する
const isBalanceAccount = id => id === NETWORTH_ID ? true : id === NET_INCOME_ID ? false : !!TYPES[A[id]?.type]?.group;
// id の値（own）を、その子孫のうち commodity が親と一致するものだけ合算してロールアップする。
// loadBook() で現在残高を TOTAL に集計するのと同じ考え方を、任意の月の値（ownMap）に対して使えるよう一般化したもの
function rollupTotal(id, ownMap){
  let v = ownMap[id] || 0;
  for (const c of (CHILDREN[id] || [])) {
    if (A[c].commodity.mnemonic === A[id].commodity.mnemonic) v += rollupTotal(c, ownMap);
  }
  return v;
}
// 純資産（資産－負債）：最上位の資産・負債科目（帳簿の主通貨のみ）のロールアップ合計。renderSidebar と同じ考え方
function netWorthAtMonth(ownMap){
  let assets = 0, liab = 0;
  for (const id of ROOTS) {
    if (A[id].commodity.mnemonic !== state.book.currency) continue;
    const g = T(A[id].type).group;
    const v = rollupTotal(id, ownMap);
    if (g === 'asset') assets += v;
    if (g === 'liab') liab -= v;
  }
  return assets - liab;
}
// id の値（own）を、子孫すべて（commodity は問わない）合算してロールアップする。
// 損益計算書の PERIOD_TOTAL と同じ考え方（収益・費用はほぼ単一通貨で運用される前提）
function rollupFlat(id, ownMap){
  if (A[id].hidden) return 0;
  let v = ownMap[id] || 0;
  for (const c of (CHILDREN[id] || [])) v += rollupFlat(c, ownMap);
  return v;
}
// 純利益・純損失：すべての収益・費用科目（非表示を除く）のロールアップ合計。損益計算書の「純利益」と同じ考え方
function netIncomeAtMonth(ownMap){
  let income = 0, expense = 0;
  for (const id of ROOTS) {
    if (A[id].hidden) continue;
    if (A[id].type === 'INCOME') income += rollupFlat(id, ownMap) * sign(id);
    if (A[id].type === 'EXPENSE') expense += rollupFlat(id, ownMap) * sign(id);
  }
  return income - expense;
}

// 登録簿一覧部分の HTML だけを組み立てる（検索中の絞り込み更新でヘッダーごと作り直さずに済むように分離）
function registerBody(id){
  const a = A[id];
  const [colL, colR] = T(a.type).cols;
  const all = state.reg.rows;
  const from = {all:'', month: state.today.slice(0, 7) + '-01', q3: shiftMonth(state.today, -3), year: state.today.slice(0,4) + '-01-01',
    report: state.periodRange?.from || ''}[state.period];
  const to = state.period === 'report' ? (state.periodRange?.to || '') : '';
  const q = state.q.trim().toLowerCase();
  let rows = all.filter(r => (!from || r.date >= from) && (!to || r.date <= to) &&
    (!q || r.desc.toLowerCase().includes(q) || (r.num || '').toLowerCase().includes(q) || (r.other && fullName(r.other).toLowerCase().includes(q))));
  const hiddenCount = Math.max(0, rows.length - state.limit);
  rows = rows.slice(hiddenCount);

  const net = {};
  for (const r of rows) { const m = r.date.slice(0, 7); net[m] = (net[m] || 0) + r.amt; }
  let body = hiddenCount ? `<button class="more" data-more>以前の取引を表示（残り ${hiddenCount.toLocaleString()} 件）</button>` : '';
  let lastM = '';
  for (const r of rows) {
    const m = r.date.slice(0, 7);
    if (m !== lastM) {
      if (state.showMonthHeaders) {
        const n = net[m] * sign(id);
        body += `<div class="month"><span>${+m.slice(0,4)}年${+m.slice(5)}月</span><span class="num">${n>=0?'+':''}${money(n, id)}</span></div>`;
      }
      lastM = m;
    }
    body += state.editing === r.guid ? editRow(r, colL, colR) : viewRow(r, id);
  }
  if (!rows.length) body = `<div class="empty">${all.length ? '条件に一致する取引がありません' : 'まだ取引がありません。'}</div>`;
  return body;
}

async function ensureTx(guid){
  return state.txCache[guid] ||= await api('GET', `/api/transactions/${guid}`);

const blankLine = () => ({guid: null, acct: '', memo: '', l: '', r: ''});
const lineOf = (acct, memo, value, guid = null) => ({guid, acct: acct ? fullName(acct) : '', memo: memo || '',
  l: value > 0 ? plain(value, ctx()) : '', r: value < 0 ? plain(value, ctx()) : ''});

  return {tx, editable: tx.editable, reason: tx.reason, date: tx.date, desc: tx.desc,

// 画面の入力値を下書きに書き戻す（行の追加・削除で描き直す前に呼ぶ）
function syncDraft(form){
  const d = state.drafts[draftKey(form)]; if (!d) return null;
  d.date = form.elements.date.value; d.desc = form.elements.desc.value;
  form.querySelectorAll('.sline[data-line]').forEach(el => {

  });
  return d;
}

// 分割行の合計から、この科目の金額欄・貸借差額・残高プレビューを更新
function splitTotals(form){
  const d = syncDraft(form); if (!d) return null;
  const fr = ctxFraction();
  let total = 0, own = 0, debit = 0;
  for (const l of d.lines) {
    const v = Math.round(((parseAmt(l.l) || 0) - (parseAmt(l.r) || 0)) * fr);
    if (isNaN(v)) continue;
    total += v;
    if (v > 0) debit += v;
    if (state.view === 'account' && resolveAccount(l.acct) === state.selected) own += v;
  }
  return {total: total / fr, own: own / fr, debit: debit / fr, d};
}
function updateSplitSummary(form){
  const t = splitTotals(form); if (!t) return;
  if (form.elements.amt) {   // 最近の取引：金額欄には借方の合計を出す
    form.elements.amt.value = t.debit ? plain(t.debit, ctx()) : '';

    form.elements.l.value = t.own > 0 ? plain(t.own, state.selected) : '';
    form.elements.r.value = t.own < 0 ? plain(t.own, state.selected) : '';
  }

    form.querySelector('[data-balance]').hidden = t.total === 0;

}

async function startSplit(form){
  const key = draftKey(form), f = form.elements;
  if (key === 'rnew') {   // 最近の取引：入金先（借方）・出金元（貸方）の 2 行から始める
    const amt = parseAmt(f.amt.value) || 0;
    const from = resolveAccount(f.from.value), to = resolveAccount(f.to.value);
    state.drafts.rnew = {editable: true, date: f.date.value, desc: f.desc.value,
      lines: [{...lineOf(to, '', amt), acct: to ? fullName(to) : f.to.value},
              {...lineOf(from, '', -amt), acct: from ? fullName(from) : f.from.value}, blankLine()]};
  } else if (key === 'new') {
    const v = (parseAmt(f.l.value) || 0) - (parseAmt(f.r.value) || 0);
    const other = resolveAccount(f.acct.value);
    state.drafts.new = {editable: true, date: f.date.value, desc: f.desc.value,
      lines: [lineOf(state.selected, '', v), {...lineOf(other, '', -v), acct: other ? fullName(other) : f.acct.value}, blankLine()]};
  } else {
    let tx;
    try { tx = await ensureTx(key); } catch (e) { form.querySelector('[data-msg]').textContent = e.message; return; }
    if (!tx.editable) { form.querySelector('[data-msg]').textContent = tx.reason; return; }
    state.drafts[key] = {...draftFromTx(tx), date: f.date.value, desc: f.desc.value};
  }
  render();
  focusLine(key, state.drafts[key].lines.length - 1);
}
function focusLine(key, i){
  const form = document.querySelector(key === 'new' ? 'form.composer' : key === 'rnew' ? 'form[data-form="rnew"]' : `form[data-guid="${key}"]`);
  form?.querySelector(`.sline[data-line="${i}"] [data-k=acct]`)?.focus();
}
function readSplitForm(form, d){
  form.querySelectorAll('.f').forEach(el => el.classList.remove('err'));
  const err = (el, m) => { el?.classList.add('err'); el?.focus(); form.querySelector('[data-msg]').textContent = m; return null; };
  syncDraft(form);
  if (!d.date) return err(form.elements.date, '日付を入力してください');
  const fr = ctxFraction();
  const out = []; let total = 0;
  for (const [i, l] of d.lines.entries()) {
    const el = form.querySelector(`.sline[data-line="${i}"]`);
    const q = k => el.querySelector(`[data-k=${k}]`);
    if (!l.acct.trim() && !l.l && !l.r && !l.memo.trim()) continue;   // 空行は無視
    const acct = resolveAccount(l.acct);
    if (!acct) return err(q('acct'), `${i + 1} 行目：勘定科目を一覧から選んでください`);
    if (A[acct].placeholder) return err(q('acct'), `${i + 1} 行目：集計用の科目には記録できません`);
    const lv = parseAmt(l.l), rv = parseAmt(l.r);
    if (isNaN(lv)) return err(q('l'), `${i + 1} 行目：金額は数字で入力してください`);
    if (isNaN(rv)) return err(q('r'), `${i + 1} 行目：金額は数字で入力してください`);
    if (lv && rv) return err(q('r'), `${i + 1} 行目：どちらか一方だけ入力してください`);
    const v = lv - rv;
    total += Math.round(v * fr);
    out.push({guid: l.guid || undefined, account: acct, memo: l.memo.trim(), amount: v.toFixed(digitsOf(ctx()))});
  }
  if (out.length < 2) return err(null, '分割は 2 行以上入力してください');
  if (total !== 0) return err(null, `貸借が一致していません（差額 ${money(Math.abs(total / fr), ctx())}）`);
  return {date: d.date, desc: d.desc.trim(), splits: out};
}

/* ---------- 補完リスト ---------- */
// iOS の <datalist>（ネイティブ候補表示）は scene-update のハング（画面が完全に固まる不具合）の
// 原因になることが実機検証で確認できたため使わない。かわりに普通のDOM要素で自前のドロップダウンを出す。
// #suggestBox は #main の外（render() で作り直されない場所）に置いてあるので、
// 候補の表示・更新のたびにネイティブUIや要素そのものを壊して作り直すことがなく、この種の不具合を構造的に避けられる。
function suggestOptions(type){
  if (type === 'desc') return state.book.descriptions;
  if (type === 'acct') return state.book.accounts
    .filter(a => !a.placeholder && (state.view !== 'account' || a.guid !== state.selected)).map(a => fullName(a.guid));
  if (type === 'acctAll') return state.book.accounts.filter(a => !a.placeholder).map(a => fullName(a.guid));
  // 統計・グラフ画面の科目追加欄専用：実在の科目に加えて「純資産（資産－負債）」の疑似項目も選べるようにする
  // （acctAll は取引の分割行や取り込み画面の科目マッピングなど他の用途でも共有しているため、
  // そちらに実在しない項目を混ぜると選べても解決できない選択肢になってしまう）
  if (type === 'statsAcct') return [statsLabel(NETWORTH_ID), statsLabel(NET_INCOME_ID), ...suggestOptions('acctAll')];
  return [];
}
const suggest = {input: null, items: []};
function closeSuggest(){
  suggest.input = null; suggest.items = [];
  document.getElementById('suggestBox').hidden = true;
}
function openSuggest(input){
  const q = input.value.trim().toLowerCase();
  const items = suggestOptions(input.dataset.suggest).filter(v => !q || v.toLowerCase().includes(q)).slice(0, 50);
  if (!items.length) return closeSuggest();
  suggest.input = input; suggest.items = items;
  const box = document.getElementById('suggestBox');
  box.innerHTML = items.map(v => `<div class="suggest-item">${esc(v)}</div>`).join('');
  const r = input.getBoundingClientRect();
  // position:absolute なのでページ基準（ビューポート基準の座標 + スクロール量）に変換する
  box.style.left = (r.left + window.scrollX) + 'px';
  box.style.top = (r.bottom + window.scrollY + 4) + 'px';
  box.style.width = r.width + 'px';
  box.hidden = false;
}
function suggestIndex(){ return [...document.getElementById('suggestBox').children].findIndex(el => el.classList.contains('on')); }
function moveSuggest(delta){
  if (!suggest.items.length) return;
  const items = [...document.getElementById('suggestBox').children];
  const i = (suggestIndex() + delta + items.length) % items.length;
  items.forEach((el, j) => el.classList.toggle('on', j === i));
  items[i].scrollIntoView({block: 'nearest'});
}
function pickSuggest(i){
  const input = suggest.input, value = suggest.items[i];
  if (!input || value == null) return;
  closeSuggest();
  input.value = value;
  input.dispatchEvent(new Event('input', {bubbles: true}));
  input.dispatchEvent(new Event('change', {bubbles: true}));
  input.focus();
}
document.addEventListener('focusin', e => { if (e.target.matches?.('[data-suggest]')) openSuggest(e.target); });
document.addEventListener('input', e => { if (e.target.matches?.('[data-suggest]')) openSuggest(e.target); });
// 取り込み画面の科目マッピング欄は、他の行を保存して再描画されても入力中の文字が消えないよう、
// 1文字ごとに state に退避しておく（保存できた行の分だけ saveXxxMapping 側で破棄する）
document.addEventListener('input', e => {
  const row = e.target.closest?.('.imp-map-row');
  if (!row || !state.imp) return;
  const key = row.dataset.mapInst !== undefined ? 'inst:' + row.dataset.mapInst
    : row.dataset.mapCat !== undefined ? 'cat:' + row.dataset.mapCat
    : row.dataset.mapDesc !== undefined ? 'desc:' + row.dataset.mapDesc : null;
  if (key) (state.imp.drafts ??= {})[key] = e.target.value;
});
document.addEventListener('focusout', e => {
  if (!e.target.matches?.('[data-suggest]')) return;
  const target = e.target;
  setTimeout(() => {
    const a = document.activeElement;
    // クリアボタンなどでフォーカスが一瞬外れてすぐ同じ欄に戻った場合は、その間に出した
    // 候補一覧を閉じない（閉じる判定が後から実行され、再度開いた候補を消してしまうのを防ぐ）
    if (a === target || document.getElementById('suggestBox').contains(a)) return;
    closeSuggest();
  }, 0);
});
document.addEventListener('keydown', e => {
  if (!suggest.input || e.target !== suggest.input) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSuggest(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveSuggest(-1); }
  else if (e.key === 'Enter' && suggestIndex() >= 0) { e.preventDefault(); pickSuggest(suggestIndex()); }
  else if (e.key === 'Enter' && e.target.id === 'statsAcctInput') { e.preventDefault(); addStatsAccount(); }
  else if (e.key === 'Escape') { closeSuggest(); }
});
document.getElementById('suggestBox').addEventListener('mousedown', e => {
  const item = e.target.closest('.suggest-item'); if (!item) return;
  e.preventDefault();   // blur（focusout）より先に発火させ、クリックでフォーカスが外れないようにする
  pickSuggest([...item.parentElement.children].indexOf(item));
});

/* ---------- 取引一覧の行を左スワイプすると削除ボタンが出る ---------- */
const SWIPE_REVEAL = 84;
function closeSwipeEl(el){
  el.classList.remove('open');
  el.querySelector('.swipe-content').style.transform = '';
}
function closeAllSwipes(except){
  document.querySelectorAll('.swipe.open').forEach(el => { if (el !== except) closeSwipeEl(el); });
}
let swipeTouch = null;
document.addEventListener('touchstart', e => {
  const el = e.target.closest('.swipe');
  if (!el) { closeAllSwipes(); swipeTouch = null; return; }   // 関係ない場所（保存ボタンなど）に触れたら前のジェスチャーの残りも必ず捨てる
  if (e.target.closest('[data-swipe-del]')) return;   // 削除ボタン自体はクリックに任せる
  const t = e.touches[0];
  const wasOpen = el.classList.contains('open');
  if (!wasOpen) closeAllSwipes(el);
  swipeTouch = {el, startX: t.clientX, startY: t.clientY, curX: wasOpen ? -SWIPE_REVEAL : 0, dragging: false, wasOpen};
}, {passive: true});
document.addEventListener('touchmove', e => {
  if (!swipeTouch) return;
  const t = e.touches[0];
  const dx = t.clientX - swipeTouch.startX, dy = t.clientY - swipeTouch.startY;
  if (!swipeTouch.dragging) {
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (Math.abs(dy) > Math.abs(dx)) { swipeTouch = null; return; }   // 縦スクロールとみなして諦める
    swipeTouch.dragging = true;
    swipeTouch.el.classList.add('dragging');
  }
  const base = swipeTouch.wasOpen ? -SWIPE_REVEAL : 0;
  swipeTouch.curX = Math.max(-SWIPE_REVEAL, Math.min(0, base + dx));
  swipeTouch.el.querySelector('.swipe-content').style.transform = `translateX(${swipeTouch.curX}px)`;
  e.preventDefault();
}, {passive: false});
document.addEventListener('touchend', () => {
  if (!swipeTouch) return;
  const {el, dragging, curX} = swipeTouch;
  el.classList.remove('dragging');
  if (dragging) {
    if (curX < -SWIPE_REVEAL / 2) { el.classList.add('open'); el.querySelector('.swipe-content').style.transform = `translateX(${-SWIPE_REVEAL}px)`; }
    else closeSwipeEl(el);
  }
  swipeTouch = null;
});
// タッチ中に要素が消える（編集・保存などで描き直される）と touchend ではなく touchcancel が来るので、
// ここで捨てておかないと swipeTouch が残ったままになり、次の無関係なタップの touchend で誤動作する
document.addEventListener('touchcancel', () => {
  if (!swipeTouch) return;
  swipeTouch.el.classList.remove('dragging');
  closeSwipeEl(swipeTouch.el);
  swipeTouch = null;
});
document.addEventListener('click', e => {
  const delBtn = e.target.closest('[data-swipe-del]');
  if (delBtn) { del(delBtn.dataset.swipeDel); return; }
  // 開いている状態で行自体をタップしたら、編集を開かずまず閉じるだけにする
  const content = e.target.closest('.swipe-content');
  const wrap = content?.closest('.swipe');
  if (wrap?.classList.contains('open')) { closeSwipeEl(wrap); e.stopPropagation(); }
}, true);

// 戻る/進む（popstate）に反応して描き直すときは、ブラウザ側が既に URL を変えているので
// 履歴をさらに書き換えない（pushState/replaceState どちらも呼ばない）
let skipHistoryWrite = false;
// anchor: 描き直し後にスクロール・フォーカスを合わせる取引の GUID（編集のキャンセル時など）
// nav: true なら「別の画面への移動」として履歴に積む（pushState）。省略時は従来通り replaceState
function render({scrollBottom = false, anchor = null, nav = false} = {}){
  if (!state.book) return;
  // 画面の種類に合わせて URL を同期する（最近の取引なら /recent、損益計算書なら /report、
  // 勘定科目を選んでいればその guid、それ以外は /）。科目の切り替えだけ履歴に積み、
  // 同じ画面内の描き直し（検索絞り込み・編集中など）は積まない
  const path = state.view === 'recent' ? '/recent' : state.view === 'report' ? '/report' : state.view === 'import' ? '/import'
    : state.view === 'stats' ? '/stats' : state.view === 'search' ? '/search' : state.view === 'ai' ? '/ai'
    : state.selected ? '/' + state.selected : '/';
  if (!skipHistoryWrite && location.pathname !== path) {
    try { history[nav ? 'pushState' : 'replaceState'](null, '', path + location.search); } catch {}
  }
  // 同じ科目を描き直すときはスクロール位置を引き継ぐ（innerHTML の作り直しで先頭に戻るのを防ぐ）
  const old = document.getElementById('scroll');
  const viewKey = state.view === 'recent' ? '__recent' : state.view === 'report' ? '__report' : state.view === 'import' ? '__import' : state.view === 'stats' ? '__stats' : state.view === 'search' ? '__search' : state.view === 'ai' ? '__ai' : state.selected;
  const keep = old && old.dataset.account === viewKey ? old.scrollTop : null;
  saveRecentComposer();
  closeSuggest();   // #main を作り直すと候補ドロップダウンを出していた入力欄ごと消えるため閉じておく
  swipeTouch = null;   // #main を作り直すとスワイプ中の行も消えるため、追跡中のジェスチャーを捨てる
  renderSidebar();
  renderMain();
  document.querySelectorAll('form[data-split]').forEach(updateSplitSummary);
  const sc = document.getElementById('scroll');
  if (!sc) return;
  if (scrollBottom) {
    sc.scrollTop = state.view === 'recent' ? 0 : sc.scrollHeight;   // 最近の取引は新しい順なので先頭
    sc.querySelector('.flash')?.scrollIntoView({block: 'nearest'});   // 未来日付の取引がある場合など
    return;
  }
  if (keep !== null) sc.scrollTop = keep;
  const target = (anchor && sc.querySelector(`[data-edit="${anchor}"], [data-redit="${anchor}"]`))
    || sc.querySelector('.flash, form.edit, form.redit');
  target?.scrollIntoView({block: 'nearest'});
  if (anchor) target?.focus({preventScroll: true});
}
// 検索欄の入力のたびに render() で #main ごと作り直すと、入力中の検索欄自体が作り直されてしまい、
// モバイルの日本語入力（IME変換中）だとその瞬間に画面が無反応になることがあるため、
// 一覧部分（#scroll）だけを差し替える。検索欄自身はフォーカスを保ったまま触らない
function refilterList(){
  const scroll = document.getElementById('scroll');
  if (!scroll) return;
  if (state.view === 'recent') {
    if (!state.recent || state.recent.days !== state.recentDays) return;
    scroll.innerHTML = recentBody();
  } else {
    if (!state.reg || state.reg.account !== state.selected) return;
    scroll.innerHTML = registerBody(state.selected);
  }
  scroll.scrollTop = 0;
  scroll.querySelectorAll('form[data-split]').forEach(updateSplitSummary);
}
function cancelEdit(){

/* ---------- 入力の検証と保存 ---------- */
function resolveAccount(text){
  const t = text.trim(); if (!t) return null;
  const exact = state.book.accounts.find(a => fullName(a.guid) === t);
  if (exact) return exact.guid;
  const byName = state.book.accounts.filter(a => a.name === t || fullName(a.guid).endsWith(':' + t));
  return byName.length === 1 ? byName[0].guid : null;
}
// 科目名（末端名）から完全な科目パス名を引く。見つからなければ空文字（新しい取引の出金元・入金先のデフォルト用）
function defaultAccountName(name){
  const a = state.book.accounts.find(a => a.name === name);
  return a ? fullName(a.guid) : '';
}

function readForm(form, multi){
  const g = n => form.elements[n];
  form.querySelectorAll('.f').forEach(el => el.classList.remove('err'));
  const err = (el, m) => { el.classList.add('err'); el.focus(); form.querySelector('[data-msg]').textContent = m; return null; };
  const date = g('date').value;
  if (!date) return err(g('date'), '日付を入力してください');
  const desc = g('desc').value.trim();
  if (multi) return {date, desc};
  const acct = resolveAccount(g('acct').value);
  if (!acct) return err(g('acct'), '勘定科目を一覧から選んでください');
  if (acct === state.selected) return err(g('acct'), '同じ勘定科目は選べません');
  if (A[acct].placeholder) return err(g('acct'), '集計用の科目には記録できません');
  const l = parseAmt(g('l').value), r = parseAmt(g('r').value);
  if (isNaN(l)) return err(g('l'), '金額は数字で入力してください');
  if (isNaN(r)) return err(g('r'), '金額は数字で入力してください');
  if (l && r) return err(g('r'), 'どちらか一方だけ入力してください');
  if (!l && !r) return err(g('l'), '金額を入力してください');
  return {date, desc, acct, amount: (l - r).toFixed(digitsOf(state.selected))};

/* ---------- マネーフォワード ME 取り込み ----------
   CSV（計算対象,日付,内容,金額（円）,保有金融機関,大項目,中項目,メモ,振替,ID）を解析し、
   「保有金融機関→資産/負債科目」のマッピングと、相手科目のマッピングで取引に変換する。
   相手科目は ①振替（他のMF連携口座との資産/負債間の移動）行どうしを同じファイル内で
   日付・金額の絶対値が同じ・符号が逆で自動ペアリングした相手の保有金融機関 ②「保有金融機関＋内容
   （メモが入力されている行はメモも含めて完全一致）」のマッピング（desc。同じカテゴリでも実際の支払先が
   複数混在する場合に個別指定するため。メモ違いは別項目として扱う）
   ③大項目/中項目のマッピング（cat。①②が無い場合のカテゴリ全体の既定） の優先順位で解決する。
   振替ペアが見つからない場合（月をまたぐ振替や、連携先がMF未追跡の場合など、実データ上よくある）は
   通常行と同様に②③で解決する */
async function decodeMfFile(file){
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const hasBom = bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF;
  const tryDecode = enc => { try { return new TextDecoder(enc, {fatal: false}).decode(buf); } catch (e) { return null; } };
  const looksBad = s => !s || (s.match(/�/g) || []).length > s.length / 50;   // 文字化けの簡易検出
  if (hasBom) return tryDecode('utf-8') || '';
  const sjis = tryDecode('shift_jis');
  if (sjis && !looksBad(sjis)) return sjis;
  const utf8 = tryDecode('utf-8');
  if (utf8 && !looksBad(utf8)) return utf8;
  return sjis || utf8 || '';
}
// ダブルクオート内のカンマ・改行・""エスケープに対応した最低限の CSV パーサー
function parseCsv(text){
  const rows = []; let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
const MF_NEED_COLS = ['日付', '内容', '金額（円）', '保有金融機関', '大項目', '中項目', '振替', 'ID'];
function parseMfCsv(text){
  const table = parseCsv(text.replace(/^﻿/, ''));
  if (!table.length) throw new Error('CSVが空です');
  const header = table[0];
  const idx = name => header.indexOf(name);
  for (const n of MF_NEED_COLS) if (idx(n) < 0) throw new Error(`CSVの形式が想定と異なります（列「${n}」が見つかりません）`);
  const iDate = idx('日付'), iDesc = idx('内容'), iAmt = idx('金額（円）'), iInst = idx('保有金融機関'),
        iMajor = idx('大項目'), iMinor = idx('中項目'), iMemo = idx('メモ'), iFuri = idx('振替'), iId = idx('ID');
  return table.slice(1).filter(r => r.length > 1 || r[0]).map(r => ({
    date: (r[iDate] || '').trim().replace(/\//g, '-'),
    desc: (r[iDesc] || '').trim(),
    amount: parseInt(r[iAmt], 10) || 0,
    inst: (r[iInst] || '').trim(),
    major: (r[iMajor] || '').trim(), minor: (r[iMinor] || '').trim(),
    memo: (r[iMemo] || '').trim(),
    furikae: r[iFuri] === '1',
    id: (r[iId] || '').trim(),
  }));
}
const catKey = (major, minor) => `${major}|||${minor}`;
// メモが入力されている行は、メモも含めて完全一致した場合だけ同一項目とみなす
// （メモが空の行は従来通り「保有金融機関＋内容」のみで一致を判定し、既存のマッピングと互換を保つ）
const descKey = (inst, desc, memo) => memo ? `${inst}|||${desc}|||${memo}` : `${inst}|||${desc}`;
// 振替行どうしを「日付・金額の絶対値が同じ・符号が逆」でグリーディにペアリングする（1行は1回だけ使う）
function pairTransfers(rows){
  const furi = rows.map((r, i) => i).filter(i => rows[i].furikae);
  const used = new Set(), pairs = {};
  for (let a = 0; a < furi.length; a++) {
    const i = furi[a]; if (used.has(i)) continue;
    for (let b = a + 1; b < furi.length; b++) {
      const j = furi[b]; if (used.has(j)) continue;
      if (rows[i].date === rows[j].date && rows[i].amount !== 0 && rows[i].amount === -rows[j].amount) {
        pairs[i] = j; pairs[j] = i; used.add(i); used.add(j); break;
      }
    }
  }
  return pairs;
}
// rows・マッピング・取り込み済みID から、各行に instAcct（自分の保有金融機関の科目）・
// otherAcct（相手科目）を解決して付与する。相手科目の優先順位は
// ①振替ペア成立ならその保有金融機関 ②「保有金融機関＋内容」（メモが入力されていればメモも含めて完全一致）
// のマッピング（desc） ③大項目/中項目のマッピング（cat、①②が無い場合のグループ既定としてのフォールバック）
function buildImportPlan(rows, mappings, importedIds){
  const pairs = pairTransfers(rows);
  const instCount = new Map(), instAmount = new Map(), catGroups = new Map();
  const bumpInst = (name, amount) => { instCount.set(name, (instCount.get(name) || 0) + 1); instAmount.set(name, amount); };
  const plan = rows.map((r, i) => {
    const dup = importedIds.has(r.id);
    const instAcct = mappings.inst[r.inst] || null;
    if (!instAcct) bumpInst(r.inst, r.amount);
    const pairIdx = pairs[i];
    let otherAcct, otherLabel, paired = false;
    const undo = [];
    if (instAcct) undo.push({kind: 'inst', key: r.inst});
    if (pairIdx !== undefined) {
      paired = true;
      const other = rows[pairIdx];
      otherAcct = mappings.inst[other.inst] || null;
      otherLabel = other.inst;
      if (otherAcct) undo.push({kind: 'inst', key: other.inst});
    } else {
      const dKey = descKey(r.inst, r.desc, r.memo), cKey = catKey(r.major, r.minor);
      const dAcct = mappings.desc[dKey] || null;
      otherAcct = dAcct || mappings.cat[cKey] || null;
      otherLabel = dAcct ? `${r.inst} / ${r.desc}${r.memo ? ' / ' + r.memo : ''}` : `${r.major} / ${r.minor}`;
      if (dAcct) undo.push({kind: 'desc', key: dKey});
      else if (otherAcct) undo.push({kind: 'cat', key: cKey});
      if (!otherAcct) {
        // カテゴリ全体が未解決（既定も個別指定も無い）行だけを、グループ内の
        // 未解決サブ項目（保有金融機関＋内容。メモが入力されていればメモも含めて区別）とともに集計する
        let g = catGroups.get(cKey);
        if (!g) { g = {key: cKey, major: r.major, minor: r.minor, count: 0, subs: new Map()}; catGroups.set(cKey, g); }
        g.count++; g.amount = r.amount;
        let s = g.subs.get(dKey);
        if (!s) { s = {key: dKey, inst: r.inst, desc: r.desc, memo: r.memo, count: 0}; g.subs.set(dKey, s); }
        s.count++; s.amount = r.amount;
      }
    }
    return {...r, idx: i, dup, instAcct, otherAcct, otherLabel, paired, pairIdx, undo};
  });
  return {
    plan,
    instUnmapped: [...instCount.entries()].map(([name, count]) => ({name, count, amount: count === 1 ? instAmount.get(name) : null})),
    catUnmapped: [...catGroups.values()].map(g => ({...g, subs: [...g.subs.values()].sort((a, b) => b.count - a.count)})),
  };
}
// 確定した plan から、実際に作成する取引（2行split）の配列を組み立てる。
// 振替ペアは1組につき1件だけ作成し、ペアの両方の CSV ID を取り込み済みとして記録する
function buildCommitItems(plan){
  const items = [], done = new Set();
  for (const r of plan) {
    if (r.dup || done.has(r.idx) || !r.instAcct || !r.otherAcct) continue;
    if (r.paired) {
      const other = plan[r.pairIdx];
      if (!other || other.dup || !other.instAcct) continue;
      done.add(r.idx); done.add(other.idx);
      items.push({date: r.date, desc: r.desc || other.desc, splits: [
        {account: r.instAcct, memo: r.memo, amount: String(r.amount)},
        {account: other.instAcct, memo: other.memo, amount: String(other.amount)}], ids: [r.id, other.id]});
    } else {
      done.add(r.idx);
      items.push({date: r.date, desc: r.desc, splits: [
        {account: r.instAcct, memo: r.memo, amount: String(r.amount)},
        {account: r.otherAcct, memo: '', amount: String(-r.amount)}], ids: [r.id]});
    }
  }
  return items;
}
async function handleImportFile(file){
  state.imp = {fileName: file.name, loading: true};
  render();
  try {
    const text = await decodeMfFile(file);
    const rows = parseMfCsv(text);
    if (!rows.length) throw new Error('取り込める行がありません');
    const [mappings, idsRes] = await Promise.all([api('GET', '/api/mf-import/mappings'), api('GET', '/api/mf-import/ids')]);
    const importedSet = new Set(idsRes.ids);
    const {plan, instUnmapped, catUnmapped} = buildImportPlan(rows, mappings, importedSet);
    state.imp = {fileName: file.name, rows, mappings, importedSet, plan, instUnmapped, catUnmapped, result: null};
  } catch (e) {
    state.imp = {fileName: file.name, error: e.message};
  }
  render();
}
async function refreshImportPlan(){
  if (!state.imp?.rows) return;
  const mappings = await api('GET', '/api/mf-import/mappings');
  const {plan, instUnmapped, catUnmapped} = buildImportPlan(state.imp.rows, mappings, state.imp.importedSet);
  state.imp = {...state.imp, mappings, plan, instUnmapped, catUnmapped};
  render();
}

async function commitImportPlan(){
  const imp = state.imp;
  if (!imp?.plan) return;
  const items = buildCommitItems(imp.plan);
  const dupCount = imp.plan.filter(r => r.dup).length;
  if (!items.length) { toast(dupCount ? `取り込める新しい行がありません（${dupCount}件は重複）` : '取り込める行がありません'); return; }
  try {
    const res = await api('POST', '/api/mf-import/commit', {items});
    const idsRes = await api('GET', '/api/mf-import/ids');
    imp.importedSet = new Set(idsRes.ids);
    imp.plan = buildImportPlan(imp.rows, imp.mappings, imp.importedSet).plan;
    await refresh();
    const pendingCount = imp.instUnmapped.reduce((n, u) => n + u.count, 0) + imp.catUnmapped.reduce((n, g) => n + g.count, 0);
    const notes = [dupCount ? `${dupCount}件は重複のためスキップ` : '', pendingCount ? `${pendingCount}件は科目未設定のため保留` : ''].filter(Boolean).join('、');
    toast(`${res.created}件取り込みました${notes ? `（${notes}）` : ''}`);
  } catch (e) { toast(e.message); }
}

// 統計・グラフ：選択中の項目（「純資産」「純利益・純損失」を含む）それぞれについて、子科目や
// 合計の集計に必要な科目一覧分の月次データを1回のAPI呼び出しでまとめて取得し、
// /api/book と同じロールアップ処理（rollupTotal・rollupFlat）で合算する
async function loadStats(){
  const st = state.stats;
  if (!st) return;
  st.data = null;
  if (state.view === 'stats') render();
  if (!st.selected.length) { st.data = {months: [], values: {}}; if (state.view === 'stats') render(); return; }
  const guids = new Set();
  for (const id of st.selected) {
    if (id === NETWORTH_ID) {
      for (const r of ROOTS) {
        if (A[r].commodity.mnemonic !== state.book.currency || !T(A[r].type).group) continue;
        descendantGuidsOf(r).forEach(g => guids.add(g));
      }
    } else if (id === NET_INCOME_ID) {
      for (const r of ROOTS) {
        if (A[r].hidden || (A[r].type !== 'INCOME' && A[r].type !== 'EXPENSE')) continue;
        descendantGuidsOf(r).forEach(g => guids.add(g));
      }
    } else {
      descendantGuidsOf(id).forEach(g => guids.add(g));
    }
  }
  try {
    const res = await api('GET', `/api/reports/account-history?from=${st.from}&to=${st.to}&accounts=${[...guids].join(',')}`);
    const monthMaps = res.months.map((_, i) => {
      const m = {}; for (const g of guids) m[g] = res.series[g]?.[i] ?? 0; return m;
    });
    const values = {};
    for (const id of st.selected) values[id] = monthMaps.map(m => id === NETWORTH_ID ? netWorthAtMonth(m)
      : id === NET_INCOME_ID ? netIncomeAtMonth(m) : rollupTotal(id, m));
    st.data = {months: res.months, values};
  } catch (e) { toast(e.message); st.data = {months: [], values: {}}; }
  if (state.view === 'stats') render();
}

// 出金元（貸方）→ 入金先（借方）。分割取引は片側が 1 科目ならその科目を出す
function pairOf(tx){
  const sp = tx.splits;
  if (sp.length === 2 && sp[0].account !== sp[1].account) {
    const cr = sp.find(x => x.value < 0) || sp[1], dr = sp.find(x => x !== cr);
    return {simple: true, from: cr.account, to: dr.account, amount: Math.abs(dr.value), fromGuid: cr.guid, toGuid: dr.guid};
  }
  const dr = sp.filter(x => x.value > 0), cr = sp.filter(x => x.value < 0);
  const one = arr => arr.length && new Set(arr.map(x => x.account)).size === 1 ? arr[0].account : null;
  return {simple: false, from: one(cr), to: one(dr), amount: dr.reduce((x, y) => x + y.value, 0)};
}
