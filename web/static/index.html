/* 入力欄のクリア（× ボタン、または Esc キー）。input イベントを発生させて既存の処理に任せる */
function clearSearch(input){
  if (!input.value) return false;
  input.value = '';
  input.dispatchEvent(new Event('input', {bubbles: true}));
  // 検索欄（id 付き）は描き直されるので新しい要素を取り直す。出金元・入金先など id のない欄はそのままフォーカスする
  (input.id ? document.getElementById(input.id) : input)?.focus();
  return true;
}
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-clear]');
  if (btn) clearSearch(btn.parentElement.querySelector('input'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (e.target.id === 'treeQ' || e.target.id === 'regQ') && clearSearch(e.target)) e.preventDefault();
});
document.getElementById('toggleAll').onclick = () => {
  const parents = state.book.accounts.filter(a => CHILDREN[a.guid]).map(a => a.guid);
  const allOpen = parents.every(p => state.expanded.has(p));
  state.expanded = new Set(allOpen ? [] : parents);
  renderSidebar();
};

const main = document.getElementById('main');
main.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-back]')) { app.classList.remove('show-main'); return; }
  const go = t.closest('[data-go]'); if (go) return select(go.dataset.go);
  const p = t.closest('[data-period]'); if (p) { state.period = p.dataset.period; state.limit = PAGE; render({scrollBottom: true}); return; }
  if (t.closest('[data-more]')) {
    const sc = document.getElementById('scroll'), h = sc.scrollHeight;
    state.limit += 1000; render(); sc.scrollTop = document.getElementById('scroll').scrollHeight - h; return;
  }
  if (t.closest('[data-new]') || t.closest('[data-open-composer]')) {
    state.composerOpen = true;
    const c = document.querySelector('form.composer'); c?.classList.add('open');
    c?.querySelector('[name=desc]')?.focus({preventScroll: true});
    const sc = document.getElementById('scroll'); if (sc) sc.scrollTop = sc.scrollHeight;
    return;
  }
  if (t.closest('[data-toggle-rcomposer]')) {
    state.recentComposerOpen = !state.recentComposerOpen;
    const c = t.closest('form');
    c?.classList.toggle('open', state.recentComposerOpen);
    if (state.recentComposerOpen) c?.querySelector('[name=desc]')?.focus({preventScroll: true});
    return;
  }
  if (t.closest('[data-cancel]')) { cancelEdit(); return; }
  const tg = t.closest('[data-split-toggle]'); if (tg) return toggleSplit(tg.dataset.splitToggle);
  const form = t.closest('form');
  if (t.closest('[data-split-start]')) return startSplit(form);
  if (t.closest('[data-split-end]')) {
    const key = draftKey(form);
    delete state.drafts[key]; render();
    document.querySelector(key === 'rnew' ? 'form[data-form="rnew"] [name=to]' : 'form.composer [name=acct]')?.focus();
    return;
  }
  if (t.closest('[data-swap]')) {
    const f = form.elements; [f.from.value, f.to.value] = [f.to.value, f.from.value]; return;
  }
  const rp = t.closest('[data-rdays]');
  if (rp) { state.recentDays = +rp.dataset.rdays; openRecent(); return; }
  if (t.closest('[data-line-add]')) {
    const d = syncDraft(form); d.lines.push(blankLine()); render(); focusLine(draftKey(form), d.lines.length - 1); return;
  }
  const ld = t.closest('[data-line-del]');
  if (ld) { const d = syncDraft(form); d.lines.splice(+ld.dataset.lineDel, 1); if (!d.lines.length) d.lines.push(blankLine()); render(); return; }
  if (t.closest('[data-balance]')) {
    // 貸借差額を空いている行（なければ新しい行）に入れる
    const {total, d} = splitTotals(form);
    let i = d.lines.findIndex(l => !l.l && !l.r);
    if (i < 0) { d.lines.push(blankLine()); i = d.lines.length - 1; }
    d.lines[i].l = total < 0 ? plain(total, ctx()) : '';
    d.lines[i].r = total > 0 ? plain(total, ctx()) : '';
    render();
    if (!d.lines[i].acct) focusLine(draftKey(form), i);
    return;
  }
  const d = t.closest('[data-del]'); if (d) return del(d.dataset.del);
  const cp = t.closest('[data-copy]'); if (cp) return copyTx(cp.dataset.copy);
  const row = t.closest('[data-edit]');
  if (row) openEdit(row.dataset.edit);
  const rrow = t.closest('[data-redit]');
  if (rrow) openRecentEdit(rrow.dataset.redit);
});
async function openEdit(guid){
  if (!canWrite()) return toast(state.book.readOnly ? '読み取り専用モードです（--write で起動すると編集できます）' : 'GnuCash デスクトップのロック中です');
  const r = state.reg.rows.find(x => x.guid === guid);
  if (r?.rec === 'y') return toast('照合済みの取引は編集できません');
  // 分割取引は分割行の編集画面で開く（GnuCash の分割表示と同じ）
  if (r?.multi) {
    try { state.drafts[guid] = draftFromTx(await ensureTx(guid)); } catch (e) { return toast(e.message); }
  }
  if (state.editing && state.editing !== guid) delete state.drafts[state.editing];
  state.editing = guid; render();
  document.querySelector('form.edit [name=desc]')?.focus();
}
async function toggleSplit(guid){
  if (state.openSplits.has(guid)) { state.openSplits.delete(guid); render(); return; }
  state.openSplits.add(guid); render();
  try { await ensureTx(guid); } catch (e) { state.openSplits.delete(guid); toast(e.message); }
  render();
}
main.addEventListener('keydown', e => {
  const row = e.target.closest('[data-edit], [data-redit]');
  if (row && e.key === 'Enter') { row.click(); return; }
  if (e.key === 'Escape') {
    const f = e.target.closest('form');
    if (f?.dataset.form === 'edit' || f?.dataset.form === 'redit') cancelEdit();
    else if (f) { f.reset(); }
  }
});
main.addEventListener('submit', e => { e.preventDefault(); e.target.dataset.mode === 'recent' ? saveRecent(e.target) : save(e.target); });
main.addEventListener('reset', e => setTimeout(() => {
  if (e.target.dataset.form === 'rnew') {   // クリアは出金元も含めて空にする
    const f = e.target.elements;
    if (!e.target.hasAttribute('data-split')) { f.desc.value = f.from.value = f.to.value = f.amt.value = ''; f.date.value = state.lastDate; }
    delete state.drafts.rnew; state.rnewVals = null; state.recentFrom = '';
    render(); document.querySelector('form[data-form="rnew"] [name=desc]')?.focus(); return;
  }
  if (state.drafts.new) { delete state.drafts.new; render(); return; }
  e.target.elements.date.value = state.lastDate; updatePreview(e.target);
  e.target.querySelectorAll('.f').forEach(el => el.classList.remove('err'));
  e.target.querySelector('[data-msg]').textContent = '';
}));
main.addEventListener('input', e => {
  if (e.target.id === 'regQ') {
    if (e.isComposing) return;   // IME変換中は確定するまで更新しない（変換中に検索欄を作り直すとハングすることがある）
    state.q = e.target.value; state.limit = PAGE;
    refilterList();
    return;
  }
  const f = e.target.closest('form'); if (!f) return;
  const k = e.target.dataset.k;
  if (k) {   // 分割行
    const line = e.target.closest('.sline');
    if (k === 'l' && e.target.value) line.querySelector('[data-k=r]').value = '';
    if (k === 'r' && e.target.value) line.querySelector('[data-k=l]').value = '';
    updateSplitSummary(f);
    return;
  }
  // 左右の金額欄は排他：片方を入れたらもう片方を消す
  if (e.target.name === 'l' && e.target.value) f.elements.r.value = '';
  if (e.target.name === 'r' && e.target.value) f.elements.l.value = '';
  updatePreview(f);
});
main.addEventListener('change', e => {
  if (e.target.name !== 'desc') return;
  const f = e.target.closest('form');
  f.dataset.form === 'rnew' ? quickfillPair(f) : quickfill(f);
});
main.addEventListener('focusout', e => {
  if ((['l', 'r', 'amt'].includes(e.target.name) || e.target.dataset.k === 'l' || e.target.dataset.k === 'r') && e.target.value) {
    const v = parseAmt(e.target.value); if (!isNaN(v)) e.target.value = v ? plain(v, ctx()) : '';
  }
});

/* ---------- パスキー認証 ---------- */
const b64u = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0)).buffer,
};
const keyIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M17 6l2 2M15 8l2 2"/></svg>';
function passkeyError(e){
  if (e?.name === 'NotAllowedError') return 'キャンセルされたか、時間切れになりました。もう一度お試しください';
  if (e?.name === 'InvalidStateError') return 'このパスキーは既に登録されています';
  if (e?.name === 'SecurityError') return 'このアドレスではパスキーを使えません。設定した URL（GNUCASH_AUTH_ORIGIN）で開いてください';
  return e?.message || String(e);
}
// 端末の種類から、パスキーの名前の初期値を作る（後で一覧に表示して区別するため）
function defaultKeyName(){
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '端末';
  const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return br ? `${os}・${br}` : os;
}
// パスキーを作成して登録する（初回は token、2 本目以降はログイン中であること）
async function createPasskey(body){
  const o = await api('POST', '/api/auth/register/options', body);
  const cred = await navigator.credentials.create({publicKey: {...o, challenge: b64u.dec(o.challenge),
    user: {...o.user, id: b64u.dec(o.user.id)}, excludeCredentials: (o.excludeCredentials || []).map(c => ({...c, id: b64u.dec(c.id)}))}});
  return api('POST', '/api/auth/register', {...body, credential: {
    id: cred.id, rawId: b64u.enc(cred.rawId), type: cred.type, authenticatorAttachment: cred.authenticatorAttachment ?? null,
    response: {clientDataJSON: b64u.enc(cred.response.clientDataJSON), attestationObject: b64u.enc(cred.response.attestationObject),
      transports: cred.response.getTransports?.() || []},
    clientExtensionResults: cred.getClientExtensionResults?.() || {}}});
}
// ID 入力なしで、端末（1Password など）に保存されたパスキーでログインする
async function loginPasskey(){
  const o = await api('POST', '/api/auth/login/options');
  const cred = await navigator.credentials.get({publicKey: {...o, challenge: b64u.dec(o.challenge),
    allowCredentials: (o.allowCredentials || []).map(c => ({...c, id: b64u.dec(c.id)}))}});
  return api('POST', '/api/auth/login', {credential: {
    id: cred.id, rawId: b64u.enc(cred.rawId), type: cred.type, authenticatorAttachment: cred.authenticatorAttachment ?? null,
    response: {clientDataJSON: b64u.enc(cred.response.clientDataJSON), authenticatorData: b64u.enc(cred.response.authenticatorData),
      signature: b64u.enc(cred.response.signature), userHandle: cred.response.userHandle ? b64u.enc(cred.response.userHandle) : null},
    clientExtensionResults: cred.getClientExtensionResults?.() || {}}});
}

async function showAuth(st){
  st ||= await api('GET', '/api/auth/status').catch(() => null);
  if (!st || !st.enabled || st.authenticated) return;
  state.auth = st;
  document.getElementById('keysDialog').open && document.getElementById('keysDialog').close();
  const el = document.getElementById('authScreen');
  const wrongOrigin = st.origin && location.origin !== st.origin;
  const unsupported = !window.isSecureContext || !window.PublicKeyCredential;
  const note = wrongOrigin
    ? `<div class="auth-msg">このページは <a href="${esc(st.origin)}">${esc(st.origin)}</a> で開いてください（パスキーは設定したアドレスでのみ使えます）</div>`
    : unsupported ? '<div class="auth-msg">このブラウザまたはアドレスではパスキーを使えません（https、または http://localhost で開いてください）</div>' : '';
  el.innerHTML = st.hasCredentials ? `
    <form class="auth-card" data-auth="login">
      <div class="logo">G</div>
      <h1>GnuCash Web</h1>
      <p>保存済みのパスキー（1Password など）でログインします</p>
      <button type="submit" class="btn primary" ${wrongOrigin || unsupported ? 'disabled' : ''}>${keyIcon}パスキーでログイン</button>
      <div class="auth-msg" data-msg></div>${note}
    </form>` : `
    <form class="auth-card" data-auth="setup">
      <div class="logo">G</div>
      <h1>パスキーの初回登録</h1>
      <p>サーバのログに表示された<b>登録用トークン</b>を入力して、このアプリ用のパスキーを作成します</p>
      <label for="authToken">登録用トークン</label>
      <input class="f token" id="authToken" name="token" placeholder="XXXX-XXXX-XXXX" autocomplete="one-time-code" autocapitalize="characters" required>
      <label for="authName">パスキーの名前（一覧で区別するため）</label>
      <input class="f" id="authName" name="name" value="${esc(defaultKeyName())}" maxlength="60">
      <button type="submit" class="btn primary" ${wrongOrigin || unsupported ? 'disabled' : ''}>${keyIcon}パスキーを作成して登録</button>
      <div class="auth-msg" data-msg></div>${note}
      <div class="auth-note">トークンの確認方法：<br>
        Docker の場合 <code>docker compose logs gnucash-web | grep トークン</code><br>
        直接起動の場合は、起動したターミナルに表示されています</div>
    </form>`;
  el.hidden = false;
  el.querySelector('input[name=token], button[type=submit]')?.focus();
}
document.getElementById('authScreen').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, msg = f.querySelector('[data-msg]'), btn = f.querySelector('button[type=submit]');
  msg.textContent = ''; btn.disabled = true;
  try {
    if (f.dataset.auth === 'setup') await createPasskey({token: f.elements.token.value, name: f.elements.name.value});
    else await loginPasskey();
    state.auth = {...state.auth, authenticated: true, hasCredentials: true};
    document.getElementById('authScreen').hidden = true;
    state.book ? await refresh() : await boot();
  } catch (err) {
    msg.textContent = passkeyError(err);
  } finally { btn.disabled = false; }
});

// サイドバー下部：パスキー管理とログアウト
document.getElementById('sideFoot').addEventListener('click', async e => {
  if (e.target.closest('[data-logout]')) {
    await api('POST', '/api/auth/logout').catch(() => {});
    state.auth = {...state.auth, authenticated: false};
    showAuth();
  }
  if (e.target.closest('[data-keys]')) openKeys();
});
async function openKeys(){
  const d = document.getElementById('keysDialog');
  d.innerHTML = '<div class="loading">読み込み中…</div>';
  d.showModal();
  await renderKeys();
}
async function renderKeys(message = ''){
  const d = document.getElementById('keysDialog');
  let list;
  try { list = (await api('GET', '/api/auth/credentials')).credentials; } catch (e) { d.close(); return; }
  const fmt = iso => iso ? new Date(iso).toLocaleString('ja-JP', {year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : '未使用';
  d.innerHTML = `
    <div class="keys-h"><h2>パスキー</h2><button type="button" class="icon-btn" data-close aria-label="閉じる">✕</button></div>
    <div class="keys-list">${list.map(c => `
      <div class="key-item">
        <span style="color:var(--muted)">${keyIcon}</span>
        <div class="k-body"><div class="k-name">${esc(c.name)}</div>
          <div class="k-meta">登録 ${fmt(c.created)}・最終使用 ${fmt(c.last_used)}${c.backed_up ? '・同期あり' : ''}</div></div>
        <button type="button" class="btn danger" data-del-key="${esc(c.id)}" data-name="${esc(c.name)}">削除</button>
      </div>`).join('') || '<div class="empty">登録されたパスキーはありません</div>'}</div>
    <form class="keys-add" data-add-key>
      <div class="row2"><input class="f" name="name" value="${esc(defaultKeyName())}" maxlength="60" aria-label="パスキーの名前">
        <button type="submit" class="btn primary">${keyIcon}追加</button></div>
      <span class="hint">この端末・ブラウザで新しいパスキーを作成します。別の端末（スマートフォンなど）はその端末でログインしてから追加してください</span>
      <div class="auth-msg" data-msg>${esc(message)}</div>
    </form>`;
}
document.getElementById('keysDialog').addEventListener('click', async e => {
  const d = document.getElementById('keysDialog');
  if (e.target.closest('[data-close]') || e.target === d) return d.close();
  const del = e.target.closest('[data-del-key]');
  if (!del) return;
  const last = d.querySelectorAll('[data-del-key]').length === 1;
  const warn = last ? '\n\n最後のパスキーです。削除するとすべての端末からログアウトされ、再登録にはサーバのログに出る登録用トークンが必要になります。' : '';
  if (!confirm(`パスキー「${del.dataset.name}」を削除しますか？${warn}`)) return;
  try {
    const res = await api('DELETE', `/api/auth/credentials/${del.dataset.delKey}`);
    if (res.remaining === 0) { d.close(); state.auth = {...state.auth, authenticated: false, hasCredentials: false}; showAuth(); }
    else renderKeys('削除しました');
  } catch (err) { renderKeys(err.message); }
});
document.getElementById('keysDialog').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('button[type=submit]');
  btn.disabled = true;
  try { const r = await createPasskey({name: f.elements.name.value}); renderKeys(`「${r.name}」を追加しました`); }
  catch (err) { f.querySelector('[data-msg]').textContent = passkeyError(err); btn.disabled = false; }
});

/* ---------- 起動 ---------- */
(async () => {
  // パスキー認証が有効で未ログインなら、ログイン画面を先に出す
  const st = await api('GET', '/api/auth/status').catch(() => ({enabled: false}));
  state.auth = st;
  if (st.enabled && !st.authenticated) return showAuth(st);
  await boot();
})();
async function boot(){
  document.getElementById('sideFoot').hidden = !state.auth?.enabled;
  try {
    await loadBook();
  } catch (e) {
    document.getElementById('tree').innerHTML = `<div class="empty">読み込みに失敗しました<br>${esc(e.message)}</div>`;
    return;
  }
  // /recent で開いた場合は「最近の取引」画面を直接表示する（ホーム画面への追加用のエントリーポイント）
  if (location.pathname === '/recent') return openRecent();
  loadRecent().then(() => renderSidebar()).catch(() => {});
  // 最初は資産科目のうち取引件数が最も多いものを開く
  const first = state.book.accounts.filter(a => T(a.type).group === 'asset' && !a.placeholder && !CHILDREN[a.guid])
    .sort((x, y) => y.count - x.count)[0] || state.book.accounts.find(a => !a.placeholder);
  if (first && !matchMedia('(max-width: 820px)').matches) await select(first.guid);
  else render();
}
</script>
