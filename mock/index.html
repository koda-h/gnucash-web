    <div class="sub num"><span>資産 ${money(assets, cur)}</span><span>負債 ${money(liab, cur)}</span></div>`;

  const lock = b.locked.map(l => `${esc(l.Hostname)}（PID ${l.PID}）`).join(', ');
  document.getElementById('banner').innerHTML =
    b.readOnly ? `<div class="banner"><b>読み取り専用</b>で開いています。編集するには <code>--write</code> を付けてサーバを起動してください。</div>`
    : b.writeBlocked ? `<div class="banner warn"><b>GnuCash デスクトップのロックがあります</b>（${lock}）。デスクトップ版を閉じるか、<code>--force</code> で起動してください。</div>`
    : '';

  document.getElementById('navRecent').classList.toggle('on', state.view === 'recent');
  document.getElementById('navReport').classList.toggle('on', state.view === 'report');
  document.getElementById('navImport').classList.toggle('on', state.view === 'import');
  document.getElementById('navStats').classList.toggle('on', state.view === 'stats');
  document.getElementById('navSearch').classList.toggle('on', state.view === 'search');
  document.getElementById('navAi').classList.toggle('on', state.view === 'ai');
  const R = state.recent;
  const recentCnt = document.getElementById('recentCnt');
  recentCnt.textContent = R ? R.rows.length : '';
  recentCnt.hidden = !R;
  if (R) document.getElementById('navRecent').dataset.tip =
    `最近の取引（${RECENT_PERIODS.find(x => x[0] === R.days)?.[1] ?? R.days + '日'}・${R.rows.length}件）`;

  const q = state.treeQ.trim();
  const ql = q.toLowerCase();
  const memo = {};
  const matches = id => memo[id] ??= A[id].name.toLowerCase().includes(ql) || (CHILDREN[id] || []).some(matches);
  const node = (id, depth) => {
    if (q && !matches(id)) return '';
    const a = A[id], kids = CHILDREN[id] || [];
    const open = q ? true : state.expanded.has(id);
    const v = TOTAL[id] * sign(id);
    return `<div role="treeitem" aria-expanded="${kids.length ? open : ''}">
      <div class="trow ${state.view==='account' && state.selected===id?'sel':''} ${a.placeholder?'ph':''} ${a.hidden?'hidden-acct':''}" data-id="${id}" style="--d:${depth}" title="${esc(a.description)}">
        ${kids.length ? `<button class="chev ${open?'open':''}" data-toggle="${id}" aria-label="展開">${chevron}</button>` : '<span class="chev-sp"></span>'}
        <span class="tname-wrap">
          <span class="tname">${hl(a.name, q)}</span>
          <button type="button" class="tedit" data-acct-edit="${id}" title="編集" aria-label="「${esc(a.name)}」を編集">${pencilIcon}</button>
        </span>
        <span class="tbal num ${v<0?'neg':''}">${money(v, id)}</span>
      </div>
      ${kids.length && open ? `<div role="group">${kids.map(c => node(c, depth+1)).join('')}</div>` : ''}
    </div>`;
  };
  document.getElementById('tree').innerHTML = ROOTS.map(r => {
    if (q && !matches(r)) return '';
    return `<div class="group-h">
      <span style="display:flex;align-items:center;gap:4px;min-width:0">
        <span class="trow-h" data-id="${r}" style="cursor:pointer">${esc(A[r].name)}</span>
        <button type="button" class="tedit" data-acct-edit="${r}" title="編集" aria-label="「${esc(A[r].name)}」を編集">${pencilIcon}</button>
      </span>
      <span class="num">${money(TOTAL[r]*sign(r), r)}</span>
    </div>`
      + (CHILDREN[r] || []).map(c => node(c, 0)).join('');
  }).join('') || '<div class="empty">該当する勘定科目がありません</div>';
}

// 勘定科目の取引一覧：期間フィルター（チップ）の定義。一覧の絞り込みと、上部の
// 「○○の入金／出金」集計の両方で同じ期間を使うため、from/to・ラベルをここで共有する
const REG_PERIODS = [['all', 'すべて'], ['month', '今月'], ['q3', '3ヶ月'], ['year', '今年']];
function regPeriodRange(period){
  if (period === 'report') return {from: state.periodRange?.from || '', to: state.periodRange?.to || ''};
  const from = {all: '', month: state.today.slice(0, 7) + '-01', q3: shiftMonth(state.today, -3),
                year: state.today.slice(0, 4) + '-01-01'}[period] ?? '';
  return {from, to: ''};
}
function regPeriodLabel(period){
  if (period === 'report') return state.periodRangeLabel || '指定期間';
  return REG_PERIODS.find(([k]) => k === period)?.[1] || 'すべて';
}

/* ---------- メイン ---------- */
function renderMain(){
  if (state.view === 'recent') return renderRecent();
  if (state.view === 'report') return renderReport();
  if (state.view === 'import') return renderImport();
  if (state.view === 'stats') return renderStats();
  if (state.view === 'search') return renderSearch();
  if (state.view === 'ai') return renderAi();
  if (state.view === 'settings') return renderSettings();
  const main = document.getElementById('main');
  const id = state.selected;
  if (!id) { main.innerHTML = '<div class="loading">左の一覧から勘定科目を選んでください</div>'; return; }
  const a = A[id];

  const header = `
    <div class="header">
      <div>
        <button class="back" data-back>‹ 勘定科目一覧</button>

        <h1 class="title">${esc(a.name)} <span class="badge">${T(a.type).label}${a.placeholder?'・集計用':''}${a.commodity.mnemonic !== state.book.currency ? '・' + esc(a.commodity.mnemonic) : ''}</span>
          <button type="button" class="tedit htedit" data-acct-edit="${id}" title="編集" aria-label="「${esc(a.name)}」を編集">${pencilIcon}</button>
        </h1>
        ${a.description ? `<div class="desc">${esc(a.description)}</div>` : ''}
      </div>
      <div class="stats" id="stats"></div>
    </div>`;

  if (a.placeholder && CHILDREN[id]) {
    main.innerHTML = header + `
      <div class="toolbar"><span class="hint" style="display:inline">この科目は集計用です。取引は子科目に記録します。</span></div>
      <div class="overview">${CHILDREN[id].map(c => `
        <button class="ocard" data-go="${c}">
          <div class="n">${esc(A[c].name)}</div>
          <div class="s">${T(A[c].type).label}${CHILDREN[c] ? `・${CHILDREN[c].length} 科目` : ''}</div>
          <div class="v num ${TOTAL[c]*sign(c)<0?'neg':''}">${money(TOTAL[c]*sign(c), c)}</div>
        </button>`).join('')}</div>`;
    document.getElementById('stats').innerHTML = `<div class="stat big"><div class="lbl">合計残高</div><div class="val num">${money(v, id)}</div></div>`;
    return;
  }

  if (!state.reg || state.reg.account !== id) {
    main.innerHTML = header + '<div class="loading">取引を読み込み中…</div>';
    return;
  }

  const [colL, colR] = T(a.type).cols;
  const all = state.reg.rows;
  const {from: statFrom, to: statTo} = regPeriodRange(state.period);
  const inStatPeriod = r => (!statFrom || r.date >= statFrom) && (!statTo || r.date <= statTo);
  const mL = all.filter(r => inStatPeriod(r) && r.amt > 0).reduce((x, r) => x + r.amt, 0);
  const mR = all.filter(r => inStatPeriod(r) && r.amt < 0).reduce((x, r) => x - r.amt, 0);

  main.innerHTML = header + `
    <div class="toolbar">
      <div class="chips" role="tablist">
        ${[...REG_PERIODS, ...(state.periodRange ? [['report', regPeriodLabel('report')]] : [])].map(([k,l]) => `<button class="chip ${state.period===k?'on':''}" data-period="${k}">${l}</button>`).join('')}
      </div>
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="regQ" placeholder="説明・勘定科目で絞り込み" value="${esc(state.q)}" autocomplete="off">
        <button type="button" class="clear" data-clear title="クリア" aria-label="入力内容をクリア"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </label>
      <button type="button" class="icon-btn ${state.showMonthHeaders ? 'on' : ''}" id="toggleMonthHeaders" title="${state.showMonthHeaders ? '月の区切りを非表示にする' : '月の区切りを表示する'}" aria-pressed="${state.showMonthHeaders}">
        ${state.showMonthHeaders
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a13.16 13.16 0 0 1-3.19 4.19M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61M9.88 9.88a3 3 0 1 0 4.24 4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'}
      </button>
      <span class="spacer"></span>
      ${canWrite() ? `<button class="btn primary" data-new>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>取引を追加</button>` : ''}
    </div>
    <div class="card">
      <div class="cols reg-head"><span>日付</span><span>説明</span><span>勘定科目</span><span class="r">${colL}</span><span class="r">${colR}</span><span class="r">残高</span></div>
      <div class="scroll" id="scroll" data-account="${id}">${registerBody(id)}</div>
      ${canWrite() ? composer(colL, colR, all.length ? all[all.length-1].bal : 0)
        : `<div class="readonly-note">${state.book.readOnly ? '読み取り専用モードのため編集できません' : 'GnuCash デスクトップのロック中のため編集できません'}</div>`}
    </div>`;

  // 子科目がある場合、登録簿はこの科目自身の取引のみ（GnuCash と同じ）なので残高を分けて表示
  const own = a.balance * sign(id);
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="lbl">${regPeriodLabel(state.period)}の${colL}</div><div class="val num">${money(mL, id)}</div></div>
    <div class="stat"><div class="lbl">${regPeriodLabel(state.period)}の${colR}</div><div class="val num">${money(mR, id)}</div></div>
    ${CHILDREN[id] ? `<div class="stat"><div class="lbl">子科目を含む合計</div><div class="val num ${v<0?'neg':''}">${money(v, id)}</div></div>` : ''}
    <div class="stat big"><div class="lbl">${CHILDREN[id] ? 'この科目の残高' : '残高'}</div><div class="val num ${own<0?'neg':''}">${money(own, id)}</div></div>`;
}

// 登録簿一覧部分の HTML だけを組み立てる（検索中の絞り込み更新でヘッダーごと作り直さずに済むように分離）
function registerBody(id){
  const a = A[id];
  const [colL, colR] = T(a.type).cols;
  const all = state.reg.rows;
  const {from, to} = regPeriodRange(state.period);
  const q = state.q.trim().toLowerCase();
  let rows = all.filter(r => (!from || r.date >= from) && (!to || r.date <= to) &&
    (!q || r.desc.toLowerCase().includes(q) || (r.num || '').toLowerCase().includes(q) || (r.other && fullName(r.other).toLowerCase().includes(q))));
  const hiddenCount = Math.max(0, rows.length - state.limit);
  rows = rows.slice(hiddenCount);

  const net = {};
  for (const r of rows) { const m = r.date.slice(0, 7); net[m] = (net[m] || 0) + r.amt; }
  let body = hiddenCount ? `<button class="more" data-more>以前の取引を表示（残り ${hiddenCount.toLocaleString()} 件）</button>` : '';
  let lastM = '';
  for (const r of rows) {
    const m = r.date.slice(0, 7);
    if (m !== lastM) {
      if (state.showMonthHeaders) {
        const n = net[m] * sign(id);
        body += `<div class="month"><span>${+m.slice(0,4)}年${+m.slice(5)}月</span><span class="num">${n>=0?'+':''}${money(n, id)}</span></div>`;
      }
      lastM = m;
    }
    body += state.editing === r.guid ? editRow(r, colL, colR) : viewRow(r, id);
  }
  if (!rows.length) body = `<div class="empty">${all.length ? '条件に一致する取引がありません' : 'まだ取引がありません。'}</div>`;
  return body;
}

function viewRow(r, id){
  const s = sign(id), bal = r.bal * s;
  const eff = r.amt * s > 0 ? 'inc' : 'dec';
  const gain = !T(A[id].type).credit && A[id].type !== 'EXPENSE' && r.amt > 0 ? 'gain' : '';
  const open = state.openSplits.has(r.guid);
  const acct = r.multi
    ? `<button type="button" class="pill split-toggle ${open?'open':''}" data-split-toggle="${r.guid}" aria-expanded="${open}" title="分割を${open?'閉じる':'表示'}">${chevron}分割取引</button>`
    : r.other ? `<button type="button" class="pill go" data-go="${r.other}" title="${esc(fullName(r.other))}">${esc(path(r.other).slice(-2).join(' › '))}</button>` : '';
  const rec = r.rec === 'y' ? '<span class="rec" title="照合済">照合</span>' : r.rec === 'c' ? '<span class="rec c" title="確認済">確認</span>' : '';
  return `<div class="cols row ${state.flash===r.guid?'flash':''}" data-edit="${r.guid}" tabindex="0">
    <span class="c-date num">${fmtDate(r.date)}</span>
    <span class="c-desc">${r.num ? `<span class="tnum">#${esc(r.num)}</span>` : ''}${r.desc ? esc(r.desc) : '<span class="ph">（説明なし）</span>'}${rec}</span>
    <span class="c-acct">${acct}</span>
    <span class="c-in r num ${r.amt > 0 ? eff : ''} ${gain}">${r.amt > 0 ? money(r.amt, id) : ''}</span>
    <span class="c-out r num ${r.amt < 0 ? eff : ''}">${r.amt < 0 ? money(-r.amt, id) : ''}</span>
    <span class="c-bal r num ${bal<0?'neg':''}">${money(bal, id)}</span>
  </div>${open ? splitView(state.txCache[r.guid]) : ''}`;
}

/* ---------- 分割取引 ---------- */
const recBadge = rec => rec === 'y' ? '<span class="rec" title="照合済">照合</span>' : rec === 'c' ? '<span class="rec c" title="確認済">確認</span>' : '';

// 分割の読み取り表示（GnuCash の「分割」表示と同じく、各 split の借方/貸方を左右の列に出す）
function splitView(tx){
  if (!tx) return '<div class="split-view"><div class="cols sline"><span></span><span class="s-memo">読み込み中…</span></div></div>';
  const [colL, colR] = T(A[state.selected].type).cols;
  return `<div class="split-view">${tx.splits.map(s => `<div class="cols sline">
    <span></span>
    <span class="s-memo">${esc(s.memo || s.action)}</span>
    <span class="c-acct">${s.account===state.selected
      ? `<span class="pill self" title="${esc(fullName(s.account))}">${esc(path(s.account).slice(-2).join(' › '))}</span>`
      : `<button type="button" class="pill go" data-go="${s.account}" title="${esc(fullName(s.account))}">${esc(path(s.account).slice(-2).join(' › '))}</button>`}</span>
    <span class="r num" data-label="${colL}">${s.value > 0 ? money(s.value, tx.currency) : ''}</span>
    <span class="r num" data-label="${colR}">${s.value < 0 ? money(-s.value, tx.currency) : ''}</span>
    <span class="r">${recBadge(s.rec)}</span>
  </div>`).join('')}</div>`;
}

async function ensureTx(guid){
  return state.txCache[guid] ||= await api('GET', `/api/transactions/${guid}`);
}
const blankLine = () => ({guid: null, acct: '', memo: '', l: '', r: ''});
const lineOf = (acct, memo, value, guid = null) => ({guid, acct: acct ? fullName(acct) : '', memo: memo || '',
  l: value > 0 ? plain(value, ctx()) : '', r: value < 0 ? plain(value, ctx()) : ''});
function draftFromTx(tx){
  return {tx, editable: tx.editable, reason: tx.reason, date: tx.date, desc: tx.desc,
    lines: [...tx.splits.map(s => lineOf(s.account, s.memo, s.value, s.guid)), blankLine()]};
}

// 画面の入力値を下書きに書き戻す（行の追加・削除で描き直す前に呼ぶ）
function syncDraft(form){
  const d = state.drafts[draftKey(form)]; if (!d) return null;
  d.date = form.elements.date.value; d.desc = form.elements.desc.value;
  form.querySelectorAll('.sline[data-line]').forEach(el => {
    const l = d.lines[+el.dataset.line];
    el.querySelectorAll('[data-k]').forEach(inp => l[inp.dataset.k] = inp.value);
  });
  return d;
}
const draftKey = form => ['new', 'rnew'].includes(form.dataset.form) ? form.dataset.form : form.dataset.guid;

function splitEditor(d, colL, colR){
  return `<div class="split-edit">
    <div class="cols sline-head"><span></span><span>メモ</span><span>勘定科目</span><span class="r">${colL}</span><span class="r">${colR}</span><span></span></div>
    ${d.lines.map((l, i) => `<div class="cols sline" data-line="${i}">
      <span class="s-idx">${i + 1}</span>
      <input class="f e-smemo" data-k="memo" value="${esc(l.memo)}" placeholder="メモ" aria-label="メモ" autocomplete="off">
      <input class="f e-sacct" data-k="acct" value="${esc(l.acct)}" placeholder="勘定科目" aria-label="勘定科目" list="acctListAll" autocomplete="off">
      <input class="f r num e-sl" data-k="l" value="${esc(l.l)}" placeholder="${colL}" aria-label="${colL}" inputmode="decimal" autocomplete="off">
      <input class="f r num e-sr" data-k="r" value="${esc(l.r)}" placeholder="${colR}" aria-label="${colR}" inputmode="decimal" autocomplete="off">
      <button type="button" class="icon-btn e-x" data-line-del="${i}" title="この行を削除" aria-label="この行を削除">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>`).join('')}
    <div class="split-foot">
      <button type="button" class="btn ghost" data-line-add>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>行を追加</button>
      <span class="spacer"></span>
      <span class="imb" data-imb></span>
      <button type="button" class="btn ghost" data-balance hidden>差額を調整</button>
    </div>
  </div>`;
}

// 分割行の合計から、この科目の金額欄・貸借差額・残高プレビューを更新
function splitTotals(form){
  const d = syncDraft(form); if (!d) return null;
  const fr = ctxFraction();
  let total = 0, own = 0, debit = 0;
  for (const l of d.lines) {
    const v = Math.round(((parseAmt(l.l) || 0) - (parseAmt(l.r) || 0)) * fr);
    if (isNaN(v)) continue;
    total += v;
    if (v > 0) debit += v;
    if (state.view === 'account' && resolveAccount(l.acct) === state.selected) own += v;
  }
  return {total: total / fr, own: own / fr, debit: debit / fr, d};
}
function updateSplitSummary(form){
  const t = splitTotals(form); if (!t) return;
  if (form.elements.amt) {   // 最近の取引：金額欄には借方の合計を出す
    form.elements.amt.value = t.debit ? plain(t.debit, ctx()) : '';
  } else {
    form.elements.l.value = t.own > 0 ? plain(t.own, state.selected) : '';
    form.elements.r.value = t.own < 0 ? plain(t.own, state.selected) : '';
  }
  const imb = form.querySelector('[data-imb]');
  if (imb) {
    imb.className = 'imb num ' + (t.total === 0 ? 'ok' : 'ng');
    imb.textContent = t.total === 0 ? '貸借一致' : `貸借差額 ${money(Math.abs(t.total), ctx())}（${t.total > 0 ? '左' : '右'}の列が多い）`;
    form.querySelector('[data-balance]').hidden = t.total === 0;
  }
  updatePreview(form);
}

async function startSplit(form){
  const key = draftKey(form), f = form.elements;
  if (key === 'rnew') {   // 最近の取引：入金先（借方）・出金元（貸方）の 2 行から始める
    const amt = parseAmt(f.amt.value) || 0;
    const from = resolveAccount(f.from.value), to = resolveAccount(f.to.value);
    state.drafts.rnew = {editable: true, date: f.date.value, desc: f.desc.value,
      lines: [{...lineOf(to, '', amt), acct: to ? fullName(to) : f.to.value},
              {...lineOf(from, '', -amt), acct: from ? fullName(from) : f.from.value}, blankLine()]};
  } else if (key === 'new') {
    const v = (parseAmt(f.l.value) || 0) - (parseAmt(f.r.value) || 0);
    const other = resolveAccount(f.acct.value);
    state.drafts.new = {editable: true, date: f.date.value, desc: f.desc.value,
      lines: [lineOf(state.selected, '', v), {...lineOf(other, '', -v), acct: other ? fullName(other) : f.acct.value}, blankLine()]};
  } else {
    let tx;
    try { tx = await ensureTx(key); } catch (e) { form.querySelector('[data-msg]').textContent = e.message; return; }
    if (!tx.editable) { form.querySelector('[data-msg]').textContent = tx.reason; return; }
    state.drafts[key] = {...draftFromTx(tx), date: f.date.value, desc: f.desc.value};
  }
  render();
  focusLine(key, state.drafts[key].lines.length - 1);
}
function focusLine(key, i){
  const form = document.querySelector(key === 'new' ? 'form.composer' : key === 'rnew' ? 'form[data-form="rnew"]' : `form[data-guid="${key}"]`);
  form?.querySelector(`.sline[data-line="${i}"] [data-k=acct]`)?.focus();
}
function readSplitForm(form, d){
  form.querySelectorAll('.f').forEach(el => el.classList.remove('err'));
  const err = (el, m) => { el?.classList.add('err'); el?.focus(); form.querySelector('[data-msg]').textContent = m; return null; };
  syncDraft(form);
  if (!d.date) return err(form.elements.date, '日付を入力してください');
  const fr = ctxFraction();
  const out = []; let total = 0;
  for (const [i, l] of d.lines.entries()) {
    const el = form.querySelector(`.sline[data-line="${i}"]`);
    const q = k => el.querySelector(`[data-k=${k}]`);
    if (!l.acct.trim() && !l.l && !l.r && !l.memo.trim()) continue;   // 空行は無視
    const acct = resolveAccount(l.acct);
    if (!acct) return err(q('acct'), `${i + 1} 行目：勘定科目を一覧から選んでください`);
    if (A[acct].placeholder) return err(q('acct'), `${i + 1} 行目：集計用の科目には記録できません`);
    const lv = parseAmt(l.l), rv = parseAmt(l.r);
    if (isNaN(lv)) return err(q('l'), `${i + 1} 行目：金額は数字で入力してください`);
    if (isNaN(rv)) return err(q('r'), `${i + 1} 行目：金額は数字で入力してください`);
    if (lv && rv) return err(q('r'), `${i + 1} 行目：どちらか一方だけ入力してください`);
    const v = lv - rv;
    total += Math.round(v * fr);
    out.push({guid: l.guid || undefined, account: acct, memo: l.memo.trim(), amount: v.toFixed(digitsOf(ctx()))});
  }
  if (out.length < 2) return err(null, '分割は 2 行以上入力してください');
  if (total !== 0) return err(null, `貸借が一致していません（差額 ${money(Math.abs(total / fr), ctx())}）`);
  return {date: d.date, desc: d.desc.trim(), splits: out};
}

// anchor: 描き直し後にスクロール・フォーカスを合わせる取引の GUID（編集のキャンセル時など）
function render({scrollBottom = false, anchor = null} = {}){
  if (!state.book) return;
  // 画面の種類に合わせて URL を同期する（最近の取引なら BASE#recent、それ以外なら BASE）。
  // 静的ホスティングでも再読み込みできるよう、パスではなくハッシュで切り替える。
  // 履歴を汚さないよう pushState ではなく replaceState を使う
  const url = BASE + location.search + (state.view === 'recent' ? '#recent' : state.view === 'report' ? '#report' : state.view === 'import' ? '#import' : state.view === 'stats' ? '#stats' : state.view === 'search' ? '#search'
    : state.view === 'ai' ? (state.aiTab === 'ledger' ? '#ai-ledger' : '#ai-analysis')
    : state.view === 'settings' ? '#settings' : '');
  // file:// や data: で開くとドキュメントの origin が null になり replaceState が
  // SecurityError を投げることがある。URL同期に失敗しても描画自体は続行する
  if (location.pathname + location.search + location.hash !== url) {
    try { history.replaceState(null, '', url); } catch {}
  }
  // 同じ科目を描き直すときはスクロール位置を引き継ぐ（innerHTML の作り直しで先頭に戻るのを防ぐ）
  const old = document.getElementById('scroll');
  const viewKey = state.view === 'recent' ? '__recent' : state.view === 'report' ? '__report' : state.view === 'import' ? '__import' : state.view === 'stats' ? '__stats' : state.view === 'search' ? '__search'
    : state.view === 'ai' ? (state.aiTab === 'ledger' ? '__ailedger' : '__ai')
    : state.view === 'settings' ? '__settings' : state.selected;
  const keep = old && old.dataset.account === viewKey ? old.scrollTop : null;
  saveRecentComposer();
  renderSidebar();
  renderMain();
  renderLists();
  document.querySelectorAll('form[data-split]').forEach(updateSplitSummary);
  const sc = document.getElementById('scroll');
  if (!sc) return;
  if (scrollBottom) {
    sc.scrollTop = state.view === 'recent' ? 0 : sc.scrollHeight;   // 最近の取引は新しい順なので先頭
    sc.querySelector('.flash')?.scrollIntoView({block: 'nearest'});   // 未来日付の取引がある場合など
    return;
  }
  if (keep !== null) sc.scrollTop = keep;
  const target = (anchor && sc.querySelector(`[data-edit="${anchor}"], [data-redit="${anchor}"]`))
    || sc.querySelector('.flash, form.edit, form.redit');
  target?.scrollIntoView({block: 'nearest'});
  if (anchor) target?.focus({preventScroll: true});
}

function resolveAccount(text){
  const t = text.trim(); if (!t) return null;
  const exact = state.book.accounts.find(a => fullName(a.guid) === t);
  if (exact) return exact.guid;
  const byName = state.book.accounts.filter(a => a.name === t || fullName(a.guid).endsWith(':' + t));
  return byName.length === 1 ? byName[0].guid : null;
}

function readForm(form, multi){
  const g = n => form.elements[n];
  form.querySelectorAll('.f').forEach(el => el.classList.remove('err'));
  const err = (el, m) => { el.classList.add('err'); el.focus(); form.querySelector('[data-msg]').textContent = m; return null; };
  const date = g('date').value;
  if (!date) return err(g('date'), '日付を入力してください');
  const desc = g('desc').value.trim();
  if (multi) return {date, desc};
  const acct = resolveAccount(g('acct').value);
  if (!acct) return err(g('acct'), '勘定科目を一覧から選んでください');
  if (acct === state.selected) return err(g('acct'), '同じ勘定科目は選べません');
  if (A[acct].placeholder) return err(g('acct'), '集計用の科目には記録できません');
  const l = parseAmt(g('l').value), r = parseAmt(g('r').value);
  if (isNaN(l)) return err(g('l'), '金額は数字で入力してください');
  if (isNaN(r)) return err(g('r'), '金額は数字で入力してください');
  if (l && r) return err(g('r'), 'どちらか一方だけ入力してください');
  if (!l && !r) return err(g('l'), '金額を入力してください');
  return {date, desc, acct, amount: (l - r).toFixed(digitsOf(state.selected))};
}

async function save(form){
  const isNew = form.dataset.form === 'new';
  const guid = form.dataset.guid;
  const key = draftKey(form), draft = state.drafts[key];
  let body, d;
  if (draft?.editable) {
    d = readSplitForm(form, draft); if (!d) return;
    body = d;
  } else {
    d = readForm(form, !!draft); if (!d) return;   // 編集できない分割取引は日付・説明のみ
    body = {account: state.selected, date: d.date, desc: d.desc};
    if (!draft) { body.other = d.acct; body.amount = d.amount; }
  }
  form.classList.add('busy');
  try {
    const res = isNew ? await api('POST', '/api/transactions', body)
                      : await api('PUT', `/api/transactions/${guid}`, body);
    state.flash = res.guid;
    delete state.drafts[key];
    state.txCache = {};
    if (isNew) state.lastDate = d.date; else state.editing = null;
    await refresh({scrollBottom: isNew});
    if (isNew) document.querySelector('form.composer [name=desc]')?.focus();
    setTimeout(() => { state.flash = null; }, 1700);
  } catch (e) {
    form.classList.remove('busy');
    form.querySelector('[data-msg]').textContent = e.message;
  }
}

async function quickfill(form){
  if (form.dataset.form !== 'new' || state.drafts.new) return;
  const desc = form.elements.desc.value.trim(); if (!desc) return;
  const res = await api('GET', `/api/quickfill?account=${state.selected}&desc=${encodeURIComponent(desc)}`).catch(() => ({}));
  if (!res.other || !A[res.other]) return;
  if (!form.elements.acct.value) form.elements.acct.value = fullName(res.other);
  if (!form.elements.l.value && !form.elements.r.value) {
    if (res.amount > 0) form.elements.l.value = plain(res.amount, state.selected);
    else form.elements.r.value = plain(res.amount, state.selected);
  }
  updatePreview(form);
}

  const p = form.querySelector('[data-preview]'); if (!p) return;
  const l = parseAmt(form.elements.l.value) || 0, r = parseAmt(form.elements.r.value) || 0;
  p.textContent = money((+p.dataset.base + l - r) * sign(state.selected), state.selected);
}

let undoFn = null, toastTimer;
async function del(guid){
  try {
    const res = await api('DELETE', `/api/transactions/${guid}`);
    state.editing = null;
    delete state.drafts[guid];
    state.txCache = {};
    await refresh();
    toast('取引を削除しました', async () => {
      const r = await api('POST', '/api/transactions/restore', res.snapshot);
      state.flash = r.guid;
    });
  } catch (e) {
    const msg = document.querySelector('form.edit [data-msg], form.redit [data-msg]');
    if (msg) msg.textContent = e.message; else toast(e.message);
  }
}
// undo: 「元に戻す」で実行する非同期関数（省略時はボタンを出さない）
function toast(msg, undo = null){
  undoFn = undo;
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastUndo').hidden = !undo;
  const el = document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}
document.getElementById('toastUndo').onclick = async () => {
  if (!undoFn) return;
  const fn = undoFn; undoFn = null;
  document.getElementById('toast').classList.remove('show');
  try {
    await fn();
    state.txCache = {};
    await refresh();
  } catch (e) { toast(e.message); }
};

// 出金元（貸方）→ 入金先（借方）。分割取引は片側が 1 科目ならその科目を出す
function pairOf(tx){
  const sp = tx.splits;
  if (sp.length === 2 && sp[0].account !== sp[1].account) {
    const cr = sp.find(x => x.value < 0) || sp[1], dr = sp.find(x => x !== cr);
    return {simple: true, from: cr.account, to: dr.account, amount: Math.abs(dr.value), fromGuid: cr.guid, toGuid: dr.guid};
  }
  const dr = sp.filter(x => x.value > 0), cr = sp.filter(x => x.value < 0);
  const one = arr => arr.length && new Set(arr.map(x => x.account)).size === 1 ? arr[0].account : null;
  return {simple: false, from: one(cr), to: one(dr), amount: dr.reduce((x, y) => x + y.value, 0)};
}
const accPill = id => A[id]
  ? `<button type="button" class="pill go" data-go="${id}" title="${esc(fullName(id))}">${esc(path(id).slice(-2).join(' › '))}</button>`
  : '<span class="pill">（不明な科目）</span>';

function recentRow(tx){
  const p = pairOf(tx), open = state.openSplits.has(tx.guid);
  const toggle = `<button type="button" class="pill split-toggle ${open?'open':''}" data-split-toggle="${tx.guid}" aria-expanded="${open}">${chevron}分割取引</button>`;
  let flow;
  if (p.simple) flow = `${accPill(p.from)}<span class="arrow">→</span>${accPill(p.to)}`;
  else if (!p.from && !p.to) flow = toggle;

const AI_PERIODS = [['3m', '3ヶ月'], ['6m', '6ヶ月'], ['1y', '1年'], ['2y', '2年'], ['year', '今年'], ['lastYear', '前年'], ['all', '全期間']];
// 分析対象期間のプリセット → {from, to}（'YYYY-MM-DD'。全期間は十分に古い日付を下限にする）
function aiRange(period, today){
  const [y, m] = today.split('-').map(Number);
  const pad2 = n => String(n).padStart(2, '0');
  const lastDay = (yy, mm) => new Date(yy, mm, 0).getDate();
  const to = `${y}-${pad2(m)}-${pad2(lastDay(y, m))}`;
  if (period === 'all') return {from: '0001-01-01', to};
  if (period === 'year') return {from: `${y}-01-01`, to};
  if (period === 'lastYear') return {from: `${y - 1}-01-01`, to: `${y - 1}-12-31`};
  if (period === '2y') return {from: `${y - 1}-01-01`, to};
  const back = {'3m': 2, '6m': 5, '1y': 11}[period];
  let fy = y, fm = m - back;
  while (fm <= 0) { fm += 12; fy -= 1; }
  return {from: `${fy}-${pad2(fm)}-01`, to};
}
function aiPeriodLabel(period, range){
  const ym = iso => { const [y, m] = iso.split('-'); return `${y}年${+m}月`; };
  return period === 'all' ? `全期間（${ym(range.to)}まで）` : `${ym(range.from)} 〜 ${ym(range.to)}`;
}

const AI_LEDGER_CREDIT_TYPES = new Set(['CREDIT', 'LIABILITY', 'PAYABLE', 'INCOME', 'EQUITY']);
function loadMockAccountMappings(){
  try { return JSON.parse(localStorage.getItem('mcpAccountMappings') || '{}'); } catch (e) { return {}; }

function mockResolveAccount(query){
  const q = (query || '').trim();
  if (!q) return {status: 'none', candidates: []};
  const candidates = state.book.accounts.filter(a => !a.placeholder);
  const withExtra = a => ({guid: a.guid, name: fullName(a.guid), type: a.type, credit: AI_LEDGER_CREDIT_TYPES.has(a.type)});
  const learned = loadMockAccountMappings()[q];
  if (learned) {
    const hit = candidates.find(a => a.guid === learned);
    if (hit) return {status: 'resolved', source: 'learned', ...withExtra(hit)};
  }
  const exact = candidates.filter(a => fullName(a.guid) === q);
  if (exact.length === 1) return {status: 'resolved', source: 'exact', ...withExtra(exact[0])};
  const matches = candidates.filter(a => a.name === q || fullName(a.guid).endsWith(':' + q));
  if (matches.length === 1) return {status: 'resolved', source: 'unique', ...withExtra(matches[0])};
  const pool = matches.length ? matches : candidates.filter(a => fullName(a.guid).includes(q));
  return {status: pool.length ? 'ambiguous' : 'none', candidates: pool.slice(0, 20).map(a => ({guid: a.guid, name: fullName(a.guid), type: a.type}))};
}
function resolveLedgerField(hint, confirmed, label){
  const text = (confirmed || hint || '').trim();
  if (!text) return {error: `${label}が指定されていません。`};
  const r = mockResolveAccount(text);
  if (r.status !== 'resolved') {
    const cand = r.status === 'none' ? '該当する勘定科目が見つかりませんでした。正式な科目名を教えてください。'
      : `候補が複数あり特定できません。どれか教えてください。\n${r.candidates.map(c => `- ${c.name}`).join('\n')}`;
    return {error: `${label}「${text}」: ${cand}`};
  }
  if (confirmed && hint && confirmed.trim() !== hint.trim()) saveMockAccountMapping(hint.trim(), r.guid);
  return {resolved: r};
}
function execLedgerTool(input){
  const amount = Number(input.amount);
  if (!isFinite(amount) || amount === 0) return {error: 'amount には 0 以外の数値を指定してください。'};
  const catRes = resolveLedgerField(input.category, input.confirmed_category, 'category');
  const payRes = resolveLedgerField(input.payment_account, input.confirmed_payment_account, 'payment_account');
  if (catRes.error || payRes.error) {
    return {error: [catRes.error, payRes.error].filter(Boolean).join('\n') + '\n\n確認できたら、正式な科目名を教えてください。'};

  state.aiLedger.pending = {lines: [{category: catRes.resolved, amount: Math.abs(amount)}],

}

  const rest = text.replace(m ? m[0] : '', '').trim();

// 科目（ロールアップ対象。hidden な科目は除く）の、ある balances（期間集計）内での合計
function rootTotal(id, bal){
  if (A[id].hidden) return 0;
  let sum = bal[id] || 0;
  for (const c of (CHILDREN[id] || [])) sum += rootTotal(c, bal);
  return sum;
}
// 集計済みの数値のみを組み立てる（取引の説明・メモは含めない）。実装時はサーバー側で同様の集計を行う
async function buildAiContext(from, to, period){
  const rep = await api('GET', `/api/reports/income-statement?from=${from}&to=${to}`);
  const bal = rep.balances;
  const PERIOD_TOTAL = {};
  const walk = id => PERIOD_TOTAL[id] = rootTotal(id, bal);
  const incomeRoots = ROOTS.filter(r => A[r].type === 'INCOME' && !A[r].hidden);
  const expenseRoots = ROOTS.filter(r => A[r].type === 'EXPENSE' && !A[r].hidden);
  [...incomeRoots, ...expenseRoots].forEach(walk);
  const incomeTotal = incomeRoots.reduce((x, r) => x + (PERIOD_TOTAL[r] || 0) * sign(r), 0);
  const expenseTotal = expenseRoots.reduce((x, r) => x + (PERIOD_TOTAL[r] || 0) * sign(r), 0);
  // 「2年」のときは、今年と前年を比較できるよう年ごとの収益・費用もあわせて取得する
  let yearly = null;
  if (period === '2y') {
    const y2 = Number(to.slice(0, 4)), y1 = y2 - 1;
    const [repLast, repThis] = await Promise.all([
      api('GET', `/api/reports/income-statement?from=${y1}-01-01&to=${y1}-12-31`),
      api('GET', `/api/reports/income-statement?from=${y2}-01-01&to=${to}`),
    ]);
    const totalsOf = b => ({
      incomeTotal: incomeRoots.reduce((x, r) => x + rootTotal(r, b) * sign(r), 0),
      expenseTotal: expenseRoots.reduce((x, r) => x + rootTotal(r, b) * sign(r), 0),
    });
    yearly = [{year: y1, ...totalsOf(repLast.balances)}, {year: y2, ...totalsOf(repThis.balances)}];
  }
  // 科目別の内訳は個別の質問にも答えられるよう全科目を対象にする（実装時はサーバー側で同様の集計を行う）。
  // ロールアップされた親科目の値をそのまま並べると二重計上になるため、末端（子科目を持たない）科目のみを対象にする
  const collectLeaves = (id, out) => {
    if (A[id].hidden) return;
    const kids = (CHILDREN[id] || []).filter(c => !A[c].hidden);
    if (!kids.length) out.push(id); else kids.forEach(c => collectLeaves(c, out));
  };
  const leafCategories = roots => { const out = []; roots.forEach(r => (CHILDREN[r] || []).forEach(c => collectLeaves(c, out))); return out; };
  const breakdown = (roots, sign_) => leafCategories(roots)
    .map(id => ({id, v: (PERIOD_TOTAL[id] || 0) * sign_(id)}))
    .filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const expenses = breakdown(expenseRoots, sign);
  const incomes = breakdown(incomeRoots, sign);
  const topExpenses = expenses.slice(0, 3);
  let txDetails = null;
  // 設定でオンの場合のみ、取引の説明・メモ（金額・科目は含めない）も取得する
  if (state.aiIncludeTxDetails) {
    const tx = await api('GET', `/api/reports/transactions?from=${from}&to=${to}&limit=${aiTxLimit(period)}`);
    const freq = {};
    for (const r of tx.rows) if (r.desc) freq[r.desc] = (freq[r.desc] || 0) + 1;
    const topDesc = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([d]) => d);
    txDetails = {count: tx.count, topDesc};
  }
  return {incomeTotal, expenseTotal, net: incomeTotal - expenseTotal, topExpenses, expenses, incomes, nw: netWorth(), txDetails, yearly};
}

// ごく簡単な Markdown → HTML（AIの回答表示用。太字・箇条書き・段落のみに対応）
function renderMarkdown(text){
  const escHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => escHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  const splitRow = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const isTableSep = line => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line);
  const lines = (text || '').split('\n');
  let html = '', para = [], list = null, i = 0;
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `<${list.type}>${list.items.map(i => `<li>${inline(i)}</li>`).join('')}</${list.type}>`; list = null; } };
  while (i < lines.length) {
    const line = lines[i];
    const heading = line.match(/^(#{1,6})\s+(.*)/);
    const ul = line.match(/^\s*[-*]\s+(.*)/);
    const ol = line.match(/^\s*\d+\.\s+(.*)/);
    // 表（GFM形式）：次の行が「|---|---|」のような区切り行なら表の開始とみなす
    if (line.includes('|') && lines[i + 1] !== undefined && isTableSep(lines[i + 1])) {
      flushPara(); flushList();
      const header = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') { rows.push(splitRow(lines[i])); i++; }
      html += `<table><thead><tr>${header.map(h => `<th>${inline(h)}</th>`).join('')}</tr></thead>`
        + `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      continue;
    }
    if (heading) {
      flushPara(); flushList();
      const tag = `h${Math.min(heading[1].length + 2, 6)}`;
      html += `<${tag}>${inline(heading[2])}</${tag}>`;
      i++; continue;
    }
    if (ul || ol) {
      flushPara();
      const type = ul ? 'ul' : 'ol';
      if (!list || list.type !== type) { flushList(); list = {type, items: []}; }
      list.items.push((ul || ol)[1]);
    } else if (line.trim() === '') {
      flushPara(); flushList();
    } else {
      flushList();
      para.push(line);
    }
    i++;
  }
  flushPara(); flushList();
  return html;
}
function aiBubble(m){
  if (Array.isArray(m.content)) {
    const img = m.content.find(b => b.type === 'image');
    const text = m.content.find(b => b.type === 'text');
    if (!img) return '';
    const imgHtml = `<img class="ai-msg-image" src="data:${img.source.media_type};base64,${img.source.data}" alt="">`;
    const body = text?.text ? esc(text.text).replace(/\n/g, '<br>') : '';
    return `<div class="ai-msg ${m.role}${m.error ? ' error' : ''}">${imgHtml}${body}</div>`;
  }
  const body = m.role === 'assistant' ? renderMarkdown(m.content) : esc(m.content).replace(/\n/g, '<br>');
  return `<div class="ai-msg ${m.role}${m.error ? ' error' : ''}">${body}</div>`;
}

function renderReport(){
  const main = document.getElementById('main');
  const range = reportRange(state.reportPreset, state.today, state.reportFrom, state.reportTo);
  const periodLabel = reportPeriodLabel(state.reportPreset, range);
  const header = `
    <div class="header"><div>
      <button class="back" data-back>‹ 勘定科目一覧</button>
      <h1 class="title">損益計算書</h1>
      <div class="desc">期間内の収益・費用を科目ごとに集計します</div>
    </div></div>
    <div class="toolbar">
      <div class="chips" role="tablist">${REPORT_PRESETS.map(([k, l]) => `<button class="chip ${state.reportPreset===k?'on':''}" data-report-preset="${k}">${l}</button>`).join('')}</div>
      ${state.reportPreset === 'custom' ? `
      <label class="fl"><span>開始年月</span><input class="f" type="month" id="reportFrom" value="${esc(state.reportFrom)}"></label>
      <label class="fl"><span>終了年月</span><input class="f" type="month" id="reportTo" value="${esc(state.reportTo)}"></label>` : ''}
    </div>
    <div class="rep-period">${esc(periodLabel)}</div>`;
  if (!state.report) { main.innerHTML = header + '<div class="loading">読み込み中…</div>'; return; }

  const bal = state.report.balances;
  // own 値をもとに階層ロールアップ（非表示科目とその子孫はレポートから除外）
  const PERIOD_TOTAL = {};
  const walk = id => {
    if (A[id].hidden) return 0;
    let sum = bal[id] || 0;
    for (const c of (CHILDREN[id] || [])) sum += walk(c);
    return PERIOD_TOTAL[id] = sum;
  };
  const incomeRoots = ROOTS.filter(r => A[r].type === 'INCOME' && !A[r].hidden);
  const expenseRoots = ROOTS.filter(r => A[r].type === 'EXPENSE' && !A[r].hidden);
  [...incomeRoots, ...expenseRoots].forEach(walk);

  const node = (id, depth) => {
    const total = PERIOD_TOTAL[id];
    if (!total) return '';   // 残高ゼロの科目は非表示
    const kids = (CHILDREN[id] || []).filter(c => !A[c].hidden);
    const v = total * sign(id);
    return `<div class="rep-row" style="--d:${depth}">
      <button type="button" class="rep-name" data-go="${id}" data-go-from="${range.from}" data-go-to="${range.to}" data-go-label="${esc(periodLabel)}">${esc(A[id].name)}</button>
      <span class="rep-amt num ${v<0?'neg':''}">${money(v, id)}</span>
    </div>` + kids.map(c => node(c, depth + 1)).join('');
  };
  const section = (roots, label) => {
    const total = roots.reduce((x, r) => x + (PERIOD_TOTAL[r] || 0) * sign(r), 0);
    const rows = roots.map(r => (CHILDREN[r] || []).filter(c => !A[c].hidden).map(c => node(c, 0)).join('')).join('');
    return `<div class="rep-section">
      <div class="rep-head">${esc(label)}</div>
      ${rows || '<div class="rep-empty">この期間の取引はありません</div>'}
      <div class="rep-total"><span>${esc(label)}合計</span><span class="num">${money(total, bookCommodity())}</span></div>
    </div>`;
  };
  const incomeTotal = incomeRoots.reduce((x, r) => x + (PERIOD_TOTAL[r] || 0) * sign(r), 0);
  const expenseTotal = expenseRoots.reduce((x, r) => x + (PERIOD_TOTAL[r] || 0) * sign(r), 0);
  const net = incomeTotal - expenseTotal;

  main.innerHTML = header + `
    <div class="card rep-card">
      <div class="scroll" id="scroll" data-account="__report">
        ${section(incomeRoots, '収益')}
        ${section(expenseRoots, '費用')}
        <div class="rep-net ${net<0?'neg':''}"><span>純利益</span><span class="num">${money(net, bookCommodity())}</span></div>
      </div>
    </div>`;
}

/* ---------- 統計・グラフ ---------- */
function monthsBetween(fromYM, toYM){
  const [fy, fm] = fromYM.split('-').map(Number), [ty, tm] = toYM.split('-').map(Number);
  const out = []; let y = fy, m = fm;
  while (y < ty || (y === ty && m <= tm)) { out.push(`${y}-${String(m).padStart(2, '0')}`); m++; if (m > 12) { m = 1; y++; } }
  return out.slice(0, 120);   // 誤って極端な範囲を指定しても描画が固まらないよう上限を設ける
}
// 「純資産（資産－負債）」「純利益・純損失」は実際の科目ではなく合計の疑似シリーズとして扱う
const NETWORTH_ID = '__networth__';
const NET_INCOME_ID = '__netincome__';
const statsLabel = id => id === NETWORTH_ID ? '純資産（資産－負債）' : id === NET_INCOME_ID ? '純利益・純損失' : fullName(id);
// 科目の種類から「残高推移（資産・負債）」か「月次収支の推移（収益・費用）」かを判定する
const isBalanceAccount = id => id === NETWORTH_ID ? true : id === NET_INCOME_ID ? false : !!TYPES[A[id]?.type]?.group;
// ダミーの月次系列を決定的な疑似乱数で生成する（本実装ではサーバ側で実際の取引から計算する想定）
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mockMonthlySeries(id, months){
  const rnd = mulberry32(hashStr(id));
  const anchor = id === NETWORTH_ID ? Math.abs(netWorth().total) || 300000
    : Math.abs(TOTAL[id] || 0) || (isBalanceAccount(id) ? 300000 : 20000);
  if (isBalanceAccount(id)) {
    const vals = new Array(months.length);
    vals[months.length - 1] = anchor;
    for (let i = months.length - 2; i >= 0; i--) {
      const drift = anchor * (0.01 + rnd() * 0.025) * (rnd() < 0.55 ? 1 : -1);
      vals[i] = Math.max(0, Math.round(vals[i + 1] - drift));
    }
    return vals;
  }
  if (id === NET_INCOME_ID) {
    // 純利益・純損失は黒字・赤字どちらもありうるので、0 を跨いで変動する値にする
    const base = anchor / 1.5;
    return months.map(() => Math.round(base * (rnd() * 2.4 - 0.8)));
  }
  const base = anchor / 1.5;
  return months.map(() => Math.max(0, Math.round(base * (0.55 + rnd() * 0.9))));
}
const STATS_PALETTE = ['#3559e0', '#e8702a', '#16a34a', '#db2777', '#7c3aed', '#0891b2', '#ca8a04', '#ef4444'];
function buildStatsChartSvg(months, series){
  const W = 880, H = 300, padL = 64, padR = 16, padT = 16, padB = 34;
  const cw = W - padL - padR, ch = H - padT - padB;
  // 純利益・純損失など負の値も取りうる系列があるので、0 を跨いで表示できるようにする
  // （負の値が無ければ従来どおり 0 を下端にした表示になる）
  const allVals = series.flatMap(s => s.vals);
  const dataMax = Math.max(0, ...allVals), dataMin = Math.min(0, ...allVals);
  const margin = Math.max(1, dataMax - dataMin) * 0.1;
  const maxVal = dataMax + margin, minVal = dataMin - (dataMin < 0 ? margin : 0);
  const x = i => padL + (months.length > 1 ? i * cw / (months.length - 1) : cw / 2);
  const y = v => padT + ch * (maxVal - v) / (maxVal - minVal);
  const gridN = 4;
  const gridLines = Array.from({length: gridN + 1}, (_, i) => {
    const v = minVal + (maxVal - minVal) * i / gridN, yy = y(v);
    return `<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W - padR}" y2="${yy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${padL - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(money(v, bookCommodity()))}</text>`;
  }).join('') + (minVal < 0 && maxVal > 0
    ? `<line x1="${padL}" y1="${y(0).toFixed(1)}" x2="${W - padR}" y2="${y(0).toFixed(1)}" stroke="var(--border-strong)" stroke-width="1.5"/>` : '');
  const labelStep = Math.max(1, Math.ceil(months.length / 12));
  const xLabels = months.map((m, i) => (i % labelStep === 0 || i === months.length - 1)
    ? `<text x="${x(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(m.replace('-', '/'))}</text>` : '').join('');
  const lines = series.map(s => {
    const label = statsLabel(s.id);
    const pts = s.vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const dots = s.vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${s.color}" pointer-events="none"/>`).join('');
    // 実際に見える点（上の dots）とは別に、カーソルを当てやすいよう少し大きい透明な円を重ねてツールチップのホバー対象にする
    const hits = s.vals.map((v, i) => `<circle class="stats-pt" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9" fill="transparent"
        data-label="${esc(label)}" data-month="${esc(months[i])}" data-val="${esc(money(v, bookCommodity()))}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>${dots}${hits}`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="勘定科目ごとの月次推移の折れ線グラフ">${gridLines}${xLabels}${lines}</svg>`;
}

      </div>
      <div class="stats-chart">${buildStatsChartSvg(months, series)}<div class="stats-tooltip" id="statsTooltip" hidden></div></div>
      <div class="hint" style="display:block;padding:10px 0 0">※ イメージ確認用のダミー値です。実装時は実際の取引から計算します。</div>
    </div>`;

// 最近の取引一覧部分の HTML だけを組み立てる（検索中の絞り込み更新でヘッダーごと作り直さずに済むように分離）
function recentBody(){
  const R = state.recent, days = state.recentDays;
  const label = days === 1 ? '今日' : `過去 ${days} 日間`;
  const q = state.q.trim().toLowerCase();
  const rows = R.rows.filter(tx => !q || tx.desc.toLowerCase().includes(q)
    || tx.splits.some(s => fullName(s.account).toLowerCase().includes(q) || s.memo.toLowerCase().includes(q)));
  const today = localToday(), yesterday = shiftDay(today, -1);
  const counts = {};
  for (const tx of rows) { const k = (tx.enter || '').slice(0, 10); counts[k] = (counts[k] || 0) + 1; }
  let body = '', last = null;
  for (const tx of rows) {
    const k = (tx.enter || '').slice(0, 10);
    if (k !== last) {
      const [y, m, d] = k.split('-');
      const md = `${+m}/${+d}（${WD[new Date(+y, m-1, +d).getDay()]}）`;
      body += `<div class="month"><span>${k === today ? '今日　' : k === yesterday ? '昨日　' : ''}${md}</span><span class="num">${counts[k]} 件</span></div>`;
      last = k;
    }
    body += state.editing === tx.guid ? recentEditRow(tx) : recentRow(tx);
  }
  if (!rows.length) body = `<div class="empty">${R.rows.length ? '条件に一致する取引がありません' : `${label}に登録した取引はありません`}</div>`;
  return body;
}

function readPairForm(form){
  const g = n => form.elements[n];
  form.querySelectorAll('.f').forEach(el => el.classList.remove('err'));
  const err = (el, m) => { el.classList.add('err'); el.focus(); form.querySelector('[data-msg]').textContent = m; return null; };
  const date = g('date').value;
  if (!date) return err(g('date'), '日付を入力してください');
  const from = resolveAccount(g('from').value);
  if (!from) return err(g('from'), '出金元を一覧から選んでください');
  if (A[from].placeholder) return err(g('from'), '集計用の科目には記録できません');
  const to = resolveAccount(g('to').value);
  if (!to) return err(g('to'), '入金先を一覧から選んでください');
  if (A[to].placeholder) return err(g('to'), '集計用の科目には記録できません');
  if (from === to) return err(g('to'), '出金元と入金先が同じです');
  const amt = parseAmt(g('amt').value);
  if (isNaN(amt)) return err(g('amt'), '金額は数字で入力してください');
  if (!amt) return err(g('amt'), '金額を入力してください');
  return {date, desc: g('desc').value.trim(), from, to, amount: amt.toFixed(digitsOf(ctx()))};
}

async function saveRecent(form){
  const isNew = form.dataset.form === 'rnew';
  const guid = form.dataset.guid, key = draftKey(form), draft = state.drafts[key];
  let body, d;
  if (draft?.editable) {
    d = readSplitForm(form, draft); if (!d) return;
    body = d;
  } else if (draft) {   // 編集できない分割取引は日付・説明のみ
    const date = form.elements.date.value;
    if (!date) return;
    d = {date}; body = {date, desc: form.elements.desc.value.trim()};
  } else {
    d = readPairForm(form); if (!d) return;
    // 既存の split の GUID とメモを引き継いで、入金先（借方）・出金元（貸方）の 2 行で保存する
    const tx = isNew ? null : state.txCache[guid], p = tx ? pairOf(tx) : {};
    const memo = g => tx?.splits.find(s => s.guid === g)?.memo || '';
    body = {date: d.date, desc: d.desc, splits: [
      {guid: p.toGuid, account: d.to, memo: memo(p.toGuid), amount: d.amount},
      {guid: p.fromGuid, account: d.from, memo: memo(p.fromGuid), amount: '-' + d.amount}]};
  }
  form.classList.add('busy');
  try {
    const res = isNew ? await api('POST', '/api/transactions', body) : await api('PUT', `/api/transactions/${guid}`, body);
    state.flash = res.guid;
    delete state.drafts[key];
    state.txCache = {};
    if (isNew) {
      // 連続入力：日付と出金元を残し、説明・入金先・金額を空にする
      state.added.add(res.guid);
      state.lastDate = d.date;
      if (!draft) {
        state.recentFrom = fullName(d.from);
        const e = form.elements;
        e.desc.value = e.amt.value = ''; e.from.value = state.recentFrom; e.to.value = defaultAccountName('貸借不一致-JPY');
      }
      state.rnewVals = null;
    } else state.editing = null;
    await refresh({scrollBottom: isNew});
    if (isNew) document.querySelector('form[data-form="rnew"] [name=desc]')?.focus();
    setTimeout(() => { state.flash = null; }, 1700);
  } catch (e) {
    form.classList.remove('busy');
    form.querySelector('[data-msg]').textContent = e.message;
  }
}

// 親科目の選択肢（自分自身・その子孫は除く。深さをインデントで表す）
function accountParentOptions(excludeIds){
  const out = [];
  const walk = (id, depth) => {
    if (excludeIds.has(id)) return;
    out.push({id, depth});
    (CHILDREN[id] || []).forEach(c => walk(c, depth + 1));
  };
  ROOTS.forEach(r => walk(r, 0));
  return out;
}
function descendantGuidsOf(id){
  const out = new Set([id]);
  (CHILDREN[id] || []).forEach(c => descendantGuidsOf(c).forEach(x => out.add(x)));
  return out;
}

// 汎用の確認ダイアログ（window.confirm() の代わり。ネイティブ alert 風ではない独自UIにするため）。
// Promise<boolean> を返し、「OK」側のボタンが押されたときだけ true になる
function confirmDialog({title = '確認', body = '', okLabel = 'OK', danger = false} = {}){
  const d = document.getElementById('confirmDialog');
  d.innerHTML = `
    <div class="keys-h"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="閉じる">✕</button></div>
    <div class="confirm-body">${esc(body)}</div>
    <div class="confirm-bar">
      <button type="button" class="btn ghost" data-cancel>キャンセル</button>
      <button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okLabel)}</button>
    </div>`;
  return new Promise(resolve => {
    const finish = result => { d.removeEventListener('click', onClick); d.removeEventListener('close', onClose); d.close(); resolve(result); };
    const onClick = e => {
      if (e.target.closest('[data-ok]')) return finish(true);
      if (e.target.closest('[data-cancel]') || e.target.closest('[data-close]') || e.target === d) return finish(false);
    };
    const onClose = () => resolve(false);   // Esc キーで閉じた場合
    d.addEventListener('click', onClick);
    d.addEventListener('close', onClose, {once: true});
    d.showModal();
  });
}

  if (t.closest('[data-cancel]')) { cancelEdit(); return; }
  const tg = t.closest('[data-split-toggle]'); if (tg) return toggleSplit(tg.dataset.splitToggle);
  const form = t.closest('form');
  if (t.closest('[data-split-start]')) return startSplit(form);
  if (t.closest('[data-split-end]')) {
    const key = draftKey(form);
    delete state.drafts[key]; render();
    document.querySelector(key === 'rnew' ? 'form[data-form="rnew"] [name=to]' : 'form.composer [name=acct]')?.focus();
    return;
  }
  if (t.closest('[data-swap]')) {
    const f = form.elements; [f.from.value, f.to.value] = [f.to.value, f.from.value]; return;
  }
  const rp = t.closest('[data-rdays]');
  if (rp) { state.recentDays = +rp.dataset.rdays; openRecent(); return; }
  if (t.closest('[data-line-add]')) {
    const d = syncDraft(form); d.lines.push(blankLine()); render(); focusLine(draftKey(form), d.lines.length - 1); return;
  }
  const ld = t.closest('[data-line-del]');
  if (ld) { const d = syncDraft(form); d.lines.splice(+ld.dataset.lineDel, 1); if (!d.lines.length) d.lines.push(blankLine()); render(); return; }
  if (t.closest('[data-balance]')) {
    // 貸借差額を空いている行（なければ新しい行）に入れる
    const {total, d} = splitTotals(form);
    let i = d.lines.findIndex(l => !l.l && !l.r);
    if (i < 0) { d.lines.push(blankLine()); i = d.lines.length - 1; }
    d.lines[i].l = total < 0 ? plain(total, ctx()) : '';
    d.lines[i].r = total > 0 ? plain(total, ctx()) : '';
    render();
    if (!d.lines[i].acct) focusLine(draftKey(form), i);
    return;
  }
  const d = t.closest('[data-del]'); if (d) return del(d.dataset.del);
  const cp = t.closest('[data-copy]'); if (cp) return copyTx(cp.dataset.copy);
  const row = t.closest('[data-edit]');
  if (row) openEdit(row.dataset.edit);
  const rrow = t.closest('[data-redit]');
  if (rrow) openRecentEdit(rrow.dataset.redit);
});
async function openEdit(guid){
  if (!canWrite()) return toast(state.book.readOnly ? '読み取り専用モードです（--write で起動すると編集できます）' : 'GnuCash デスクトップのロック中です');
  const r = state.reg.rows.find(x => x.guid === guid);
  if (r?.rec === 'y') return toast('照合済みの取引は編集できません');
  // 分割取引は分割行の編集画面で開く（GnuCash の分割表示と同じ）
  if (r?.multi) {
    try { state.drafts[guid] = draftFromTx(await ensureTx(guid)); } catch (e) { return toast(e.message); }
  }
  if (state.editing && state.editing !== guid) delete state.drafts[state.editing];
  state.editing = guid; render();
  document.querySelector('form.edit [name=desc]')?.focus();
}
async function toggleSplit(guid){
  if (state.openSplits.has(guid)) { state.openSplits.delete(guid); render(); return; }
  state.openSplits.add(guid); render();
  try { await ensureTx(guid); } catch (e) { state.openSplits.delete(guid); toast(e.message); }
  render();
}

/* ---------- パスキー認証 ---------- */
const b64u = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0)).buffer,
};
const keyIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.2-8.2M17 6l2 2M15 8l2 2"/></svg>';
function passkeyError(e){
  if (e?.name === 'NotAllowedError') return 'キャンセルされたか、時間切れになりました。もう一度お試しください';
  if (e?.name === 'InvalidStateError') return 'このパスキーは既に登録されています';
  if (e?.name === 'SecurityError') return 'このアドレスではパスキーを使えません。設定した URL（GNUCASH_AUTH_ORIGIN）で開いてください';
  return e?.message || String(e);
}
// 端末の種類から、パスキーの名前の初期値を作る（後で一覧に表示して区別するため）
function defaultKeyName(){
  const ua = navigator.userAgent;
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : '端末';
  const br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
  return br ? `${os}・${br}` : os;
}
// パスキーを作成して登録する（初回は token、2 本目以降はログイン中であること）
async function createPasskey(body){
  const o = await api('POST', '/api/auth/register/options', body);
  const cred = await navigator.credentials.create({publicKey: {...o, challenge: b64u.dec(o.challenge),
    user: {...o.user, id: b64u.dec(o.user.id)}, excludeCredentials: (o.excludeCredentials || []).map(c => ({...c, id: b64u.dec(c.id)}))}});
  return api('POST', '/api/auth/register', {...body, credential: {
    id: cred.id, rawId: b64u.enc(cred.rawId), type: cred.type, authenticatorAttachment: cred.authenticatorAttachment ?? null,
    response: {clientDataJSON: b64u.enc(cred.response.clientDataJSON), attestationObject: b64u.enc(cred.response.attestationObject),
      transports: cred.response.getTransports?.() || []},
    clientExtensionResults: cred.getClientExtensionResults?.() || {}}});
}
// ID 入力なしで、端末（1Password など）に保存されたパスキーでログインする
async function loginPasskey(){
  const o = await api('POST', '/api/auth/login/options');
  const cred = await navigator.credentials.get({publicKey: {...o, challenge: b64u.dec(o.challenge),
    allowCredentials: (o.allowCredentials || []).map(c => ({...c, id: b64u.dec(c.id)}))}});
  return api('POST', '/api/auth/login', {credential: {
    id: cred.id, rawId: b64u.enc(cred.rawId), type: cred.type, authenticatorAttachment: cred.authenticatorAttachment ?? null,
    response: {clientDataJSON: b64u.enc(cred.response.clientDataJSON), authenticatorData: b64u.enc(cred.response.authenticatorData),
      signature: b64u.enc(cred.response.signature), userHandle: cred.response.userHandle ? b64u.enc(cred.response.userHandle) : null},
    clientExtensionResults: cred.getClientExtensionResults?.() || {}}});
}

async function showAuth(st){
  st ||= await api('GET', '/api/auth/status').catch(() => null);
  if (!st || !st.enabled || st.authenticated) return;

  const el = document.getElementById('authScreen');
  const wrongOrigin = st.origin && location.origin !== st.origin;

  const note = wrongOrigin
    ? `<div class="auth-msg">このページは <a href="${esc(st.origin)}">${esc(st.origin)}</a> で開いてください（パスキーは設定したアドレスでのみ使えます）</div>`
    : unsupported ? '<div class="auth-msg">このブラウザまたはアドレスではパスキーを使えません（https、または http://localhost で開いてください）</div>' : '';
  el.innerHTML = st.hasCredentials ? `
    <form class="auth-card" data-auth="login">

      <p>保存済みのパスキー（1Password など）でログインします</p>
      <button type="submit" class="btn primary" ${wrongOrigin || unsupported ? 'disabled' : ''}>${keyIcon}パスキーでログイン</button>
      <div class="auth-msg" data-msg></div>${note}
    </form>` : `
    <form class="auth-card" data-auth="setup">
      <div class="logo">G</div>
      <h1>パスキーの初回登録</h1>
      <p>サーバのログに表示された<b>登録用トークン</b>を入力して、このアプリ用のパスキーを作成します</p>
      <label for="authToken">登録用トークン</label>
      <input class="f token" id="authToken" name="token" placeholder="XXXX-XXXX-XXXX" autocomplete="one-time-code" autocapitalize="characters" required>
      <label for="authName">パスキーの名前（一覧で区別するため）</label>
      <input class="f" id="authName" name="name" value="${esc(defaultKeyName())}" maxlength="60">
      <button type="submit" class="btn primary" ${wrongOrigin || unsupported ? 'disabled' : ''}>${keyIcon}パスキーを作成して登録</button>
      <div class="auth-msg" data-msg></div>${note}
      <div class="auth-note">トークンの確認方法：<br>
        Docker の場合 <code>docker compose logs gnucash-web | grep トークン</code><br>
        直接起動の場合は、起動したターミナルに表示されています</div>
    </form>`;
  el.hidden = false;
  el.querySelector('input[name=token], button[type=submit]')?.focus();
}
document.getElementById('authScreen').addEventListener('submit', async e => {
  e.preventDefault();

    </div>
    ${state.mcpEnabled ? mcpKeysBody() : ''}`;
}
function mcpKeysBody(){
  const fmt = iso => iso ? new Date(iso).toLocaleString('ja-JP', {year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'}) : '未使用';
  const nk = state.mcpNewKey;
  const newKeyBox = nk ? `
    <div class="mcp-newkey">
      <div class="lbl">発行したAPIキー（今だけ表示されます）</div>
      <div class="sub">このキーはもう一度表示できません。MCPサーバーの GNUCASH_API_KEY にコピーしてください。</div>
      <div class="row2" style="margin-top:8px">
        <input class="f" id="mcpNewKeyInput" readonly value="${esc(nk.key)}" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px" onclick="this.select()">
        <button type="button" class="btn" data-copy-key>コピー</button>
      </div>
    </div>` : '';
  const list = (state.mcpKeys || []).map(k => `
    <div class="key-item">
      <span style="color:var(--muted)">${keyIcon}</span>
      <div class="k-body"><div class="k-name">${esc(k.label) || '(名前なし)'}</div>
        <div class="k-meta">発行 ${fmt(k.createdAt)}・最終使用 ${fmt(k.lastUsedAt)}</div></div>
      <button type="button" class="btn danger" data-del-mcp-key="${esc(k.id)}" data-label="${esc(k.label)}">失効させる</button>
    </div>`).join('');
  // MCP連携のトグルから独立した「設定全体の項目」に見えないよう、キー一覧・発行フォームは
  // 枠線付きのパネルにまとめて、MCP連携セクションの一部であることを視覚的にわかりやすくする
  return `
    <div class="mcp-keys-panel">
      ${newKeyBox}
      <div class="keys-list">${state.mcpKeys === null ? '<div class="empty">読み込み中…</div>' : (list || '<div class="empty">発行されたAPIキーはありません</div>')}</div>
      <form class="keys-add" data-add-mcp-key>
        <div class="row2"><input class="f" name="label" maxlength="60" placeholder="名前（任意。例: Claude Desktop）" aria-label="APIキーの名前">
          <button type="submit" class="btn primary">${keyIcon}発行</button></div>
        <span class="hint">発行したキーは mcp-server/server.py の GNUCASH_API_KEY に設定してください</span>
      </form>
    </div>`;
}

/* ---------- 起動 ---------- */
(async () => {
  // パスキー認証が有効で未ログインなら、ログイン画面を先に出す
  const st = await api('GET', '/api/auth/status').catch(() => ({enabled: false}));
  state.auth = st;
  if (st.enabled && !st.authenticated) return showAuth(st);
  await boot();
})();
async function boot(){
  document.getElementById('authFoot').hidden = !state.auth?.enabled;
  try {
    await loadBook();
  } catch (e) {
    document.getElementById('tree').innerHTML = `<div class="empty">読み込みに失敗しました<br>${esc(e.message)}</div>`;
    return;
  }
  // #recent（または旧形式の /recent）で開いた場合は「最近の取引」画面を直接表示する（ホーム画面への追加用のエントリーポイント）
  if (location.hash === '#recent' || /\/recent\/?$/.test(location.pathname)) return openRecent();
  if (location.hash === '#report' || /\/report\/?$/.test(location.pathname)) return openReport();
  if (location.hash === '#import' || /\/import\/?$/.test(location.pathname)) return openImport();
  if (location.hash === '#stats' || /\/stats\/?$/.test(location.pathname)) return openStats();
  if (location.hash === '#search' || /\/search\/?$/.test(location.pathname)) return openSearch();
  if (location.hash === '#ai' || location.hash === '#ai-analysis' || location.hash === '#ai-ledger' || /\/ai\/?$/.test(location.pathname)) {
    state.aiTab = location.hash === '#ai-ledger' ? 'ledger' : 'analysis';
    return openAi();
  }
  if (location.hash === '#settings' || /\/settings\/?$/.test(location.pathname)) return openSettings();
  loadRecent().then(() => renderSidebar()).catch(() => {});
  // 最初は資産科目のうち取引件数が最も多いものを開く
  const first = state.book.accounts.filter(a => T(a.type).group === 'asset' && !a.placeholder && !CHILDREN[a.guid])
    .sort((x, y) => y.count - x.count)[0] || state.book.accounts.find(a => !a.placeholder);
  if (first && !matchMedia('(max-width: 820px)').matches) await select(first.guid);
  else render();
}

// スマホでソフトキーボードが開くと、レイアウト上の高さ（dvh）はキーボード分だけ縮まない
// ブラウザがあるため、.app の高さを固定のままにしておくと入力欄下部のボタン等が
// キーボードの裏に隠れてしまう。さらに iOS Safari は、フォーカスした入力欄を見せる際に
// window.scrollY ではなく visualViewport（実際に見えている領域）だけを layout viewport
// に対して上下にずらす（visualViewport.offsetTop）ため、.app の高さだけ追従させても
// ズレが残る。.app を position:fixed にして、高さだけでなく表示位置（top）も
// visualViewport に合わせて追従させることで解決する。
// 実機で確認したところ、キーボード表示時にブラウザがまず window.scrollY を
// 動かし（＝ページ自体をスクロール）、visualViewport.offsetTop がそれに追従するのは
// 数百ms 後だった。.app の表示位置を visualViewport.offsetTop だけから計算すると、
// その数百msの間、実際にはもうずれているのに古い（0の）位置のまま取り残され、
// 入力欄が画面外（一番上）にずれて見えていた。window.scrollY は即座に更新されるため、
// 両方のうちより大きい方（＝よりズレを反映している方）を使うことで、この遅れを無くす
function syncAppHeight(){
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const top = Math.max(window.scrollY, vv ? vv.offsetTop : 0);
  document.documentElement.style.setProperty('--app-h', h + 'px');
  app.style.top = top + 'px';
}
// visualViewport が実際にずれる瞬間（キーボードの開閉でブラウザが visualViewport を
// 動かす瞬間）と、こちら側の .app の表示位置・高さの更新が同じタイミングで起きないと、
// その間の一瞬だけ入力欄が画面の一番上などおかしな位置に見えてしまう。そのため
// resize/scroll イベントには遅延やアニメーションを挟まず、即座に反映する。
// （以前 100ms間隔の再同期や transition、デバウンスを試したが、それらはいずれも
// このズレの時間を長く・目立たせる方向に働いていたため廃止した）
if (window.visualViewport) {
  visualViewport.addEventListener('resize', syncAppHeight);
  visualViewport.addEventListener('scroll', syncAppHeight);
} else {
  window.addEventListener('resize', syncAppHeight);
}
// window.scrollY は visualViewport より先に動くため、こちらも直接監視する
window.addEventListener('scroll', syncAppHeight, { passive: true });
// visualViewport のイベントが発火しない場合の保険として、フォーカス変化後にも
// 少し遅らせて確認する（こちらは遅延があっても実害が小さいケースの保険のみ）
document.addEventListener('focusin', () => setTimeout(syncAppHeight, 350), true);
document.addEventListener('focusout', () => setTimeout(syncAppHeight, 350), true);
syncAppHeight();
</script>
